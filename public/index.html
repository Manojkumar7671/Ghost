<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost OS // Admin Matrix</title>
    <style>
        body { 
            margin: 0; 
            background-color: #000; 
            color: #00ffcc; 
            font-family: monospace; 
            overflow: hidden; 
        }
        input:focus { outline: none; }
        
        /* Custom scrollbar for matrix aesthetic */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 4px; }
    </style>
</head>
<body>
    
    <div id="top-bar" style="position: absolute; top: 0; left: 0; width: 100%; padding: 15px; display: flex; align-items: center; box-sizing: border-box; z-index: 1000;">
        <div id="status-indicator" style="font-weight: bold; letter-spacing: 1px;">GHOST // STANDBY</div>
        
        <button id="ghost-code-btn" style="display: none; margin-left: 15px; border: 1px solid #00ffcc; color: #00ffcc; background: rgba(0,255,204,0.1); padding: 5px 10px; cursor: pointer; border-radius: 4px; font-weight: bold; font-family: monospace; text-shadow: 0 0 5px #00ffcc; transition: 0.3s;">[GHOST CODE: OFF]</button>
        
        <button id="disconnect-btn" style="display: none; margin-left: auto; border: 1px solid #ff0032; color: #ff0032; background: rgba(255,0,50,0.1); padding: 5px 10px; cursor: pointer; border-radius: 4px; font-weight: bold; font-family: monospace;">DISCONNECT</button>
    </div>

    <div id="auth-layer" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1001; text-align: center;">
        <input type="password" id="authInput" placeholder="Enter Passcode..." style="background: rgba(0,0,0,0.8); border: 1px solid #00ffcc; color: #00ffcc; padding: 15px; font-family: monospace; text-align: center; border-radius: 8px; width: 250px; box-shadow: 0 0 15px rgba(0,255,204,0.15);">
    </div>

    <div id="input-area" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; z-index: 1000; width: 80%;">
        <input type="file" id="image-upload" style="display: none;">
        <button id="attach-btn" style="background: rgba(0,0,0,0.8); border: 1px solid #00ffcc; color: #00ffcc; padding: 12px; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(0,255,204,0.1);">📎</button>
        <input type="text" id="chatInput" placeholder="Double-tap screen to hide..." style="width: 100%; background: rgba(0,0,0,0.8); border: 1px solid #00ffcc; color: #00ffcc; padding: 12px 20px; border-radius: 20px; font-family: monospace; box-shadow: 0 0 10px rgba(0,255,204,0.1);">
    </div>

    <canvas id="bg-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;"></canvas>

    <script src="ghost-ui.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // 1. Dynamic Circular Texture Generation (Fixes the ugly square hyphens)
        const circleCanvas = document.createElement('canvas');
        circleCanvas.width = 64;
        circleCanvas.height = 64;
        const ctx = circleCanvas.getContext('2d');
        ctx.beginPath();
        ctx.arc(32, 32, 30, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        const circleTexture = new THREE.CanvasTexture(circleCanvas);

        // 2. High-Density Holographic Sphere
        const geometry = new THREE.SphereGeometry(14, 64, 64); 
        const material = new THREE.PointsMaterial({
            color: 0x00ffcc, // Ghost Default Cyan
            size: 0.15,
            map: circleTexture, // Applies the smooth glowing dot
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
            depthWrite: false // Prevents particles from clipping into black squares
        });

        const particleSphere = new THREE.Points(geometry, material);
        scene.add(particleSphere);

        camera.position.z = 30;

        // Store baseline vertex data for fluid rippling
        const positionAttribute = geometry.getAttribute('position');
        const vertexData = [];
        for (let i = 0; i < positionAttribute.count; i++) {
            vertexData.push({
                x: positionAttribute.getX(i),
                y: positionAttribute.getY(i),
                z: positionAttribute.getZ(i),
                phase: Math.random() * Math.PI * 2 
            });
        }

        // Color override for Admin/Guest shifts
        const observer = new MutationObserver(() => {
            const statusColor = document.getElementById('status-indicator').style.color;
            if (statusColor === 'rgb(255, 0, 50)' || statusColor === '#ff0032') {
                material.color.setHex(0xff0032); 
            } else {
                material.color.setHex(0x00ffcc); 
            }
        });
        observer.observe(document.getElementById('status-indicator'), { attributes: true, attributeFilter: ['style'] });

        let clock = new THREE.Clock();

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Smooth base rotation
            particleSphere.rotation.x = time * 0.05;
            particleSphere.rotation.y = time * 0.08;

            // Fluid oceanic ripple effect
            for (let i = 0; i < positionAttribute.count; i++) {
                const data = vertexData[i];
                const wave = Math.sin(data.x * 0.5 + time) * Math.cos(data.y * 0.5 + time);
                const pulse = 1 + (wave * 0.02); 
                positionAttribute.setXYZ(i, data.x * pulse, data.y * pulse, data.z * pulse);
            }
            positionAttribute.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        // Window resize handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
