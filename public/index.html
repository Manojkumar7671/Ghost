<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghost OS v19</title>
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js](https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js)"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #0df; font-family: monospace; overflow: hidden; user-select: none; }
        #overlay { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; }
        .sys-text { letter-spacing: 5px; font-size: 24px; font-weight: bold; text-transform: uppercase; text-shadow: 0 0 10px #0df; }
        #subtitle { position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%); width: 80%; text-align: center; font-size: 1.2em; line-height: 1.5; color: #0df; z-index: 10; text-shadow: 0 0 5px #0df; pointer-events: none; }
        #sidebar { position: absolute; right: -450px; top: 0; width: 400px; height: 100%; background: rgba(0, 0, 0, 0.9); border-left: 2px solid rgba(0,221,255,0.3); padding: 20px; box-sizing: border-box; transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 20; overflow-y: auto; }
        #sidebar.open { right: 0; }
        .sidebar-header { border-bottom: 1px solid rgba(0,221,255,0.4); padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; letter-spacing: 2px; }
        #sidebar-content { font-size: 0.9em; color: #aaa; line-height: 1.5; white-space: pre-wrap; }
        
        /* HIDDEN BY DEFAULT: Text box area only drops down on double tap */
        #text-fallback { position: absolute; bottom: -100px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; gap: 10px; align-items: center; transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        #text-fallback.visible { bottom: 50px; }
        
        #text-fallback input[type="text"] { background: rgba(0,0,0,0.8); border: 1px solid #0df; color: #0df; padding: 12px; width: 300px; font-family: monospace; outline: none; }
        #text-fallback input[type="file"] { display: none; }
        .upload-btn { background: rgba(0,0,0,0.8); color: #0df; border: 1px solid #0df; padding: 12px 15px; cursor: pointer; font-family: monospace; text-transform: uppercase; transition: all 0.2s; }
        .upload-btn:hover { background: #0df; color: #000; }
        #text-fallback button.run-btn { background: #0df; color: #000; border: none; padding: 12px 20px; cursor: pointer; font-weight: bold; font-family: monospace; }
        #text-fallback button.run-btn:hover { box-shadow: 0 0 10px #0df; }
    </style>
</head>
<body>
    <div id="overlay"><div class="sys-text" id="status">GHOST V19</div></div>
    <div id="subtitle"></div>
    <div id="sidebar"><div class="sidebar-header">MATRIX PAYLOAD</div><div id="sidebar-content"></div></div>
    
    <div id="text-fallback">
        <label for="file-upload" class="upload-btn">UPLOAD FILE</label>
        <input type="file" id="file-upload" onchange="handleFileUpload(event)">
        <input type="text" id="manual-input" placeholder="Execute command..." onkeypress="if(event.key === 'Enter') sendManual()">
        <button class="run-btn" onclick="sendManual()">RUN</button>
    </div>

    <script>
        setInterval(() => { fetch('/ping').catch(() => {}); }, 120000);
            
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const geometry = new THREE.BufferGeometry(); 
        const particlesCount = 4500;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i+=3) {
            const r = 2.3, theta = 2 * Math.PI * Math.random(), phi = Math.acos(2 * Math.random() - 1);
            posArray[i] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = r * Math.cos(phi);
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3)); 
        const material = new THREE.PointsMaterial({ size: 0.02, color: 0x00ddff, transparent: true, opacity: 0.8 });
        const particlesMesh = new THREE.Points(geometry, material);
        scene.add(particlesMesh);
        camera.position.z = 5.5; 
        let orbState = 'idle';
        let clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.002;
            particlesMesh.rotation.x += 0.001;
            if (orbState === 'processing') { material.color.setHex(0xffaa00); particlesMesh.rotation.y += 0.04; }
            else if (orbState === 'speaking') { material.color.setHex(0x00ddff); const p = 1 + Math.sin(clock.getElapsedTime()*5)*0.2; particlesMesh.scale.set(p,p,p); }
            else if (orbState === 'error') { material.color.setHex(0xff0000); particlesMesh.scale.set(1, 1, 1); }
            else { material.color.setHex(0x00ddff); particlesMesh.scale.set(1, 1, 1); }
            renderer.render(scene, camera);   
        }
        animate();
        
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        
        // --- HANDS-FREE DOUBLE TAP INTERACTION GESTURE ---
        window.addEventListener('dblclick', () => {
            const entryPanel = document.getElementById('text-fallback');
            entryPanel.classList.toggle('visible');
            if(entryPanel.classList.contains('visible')) {
                document.getElementById('manual-input').focus();
            }
        });

        const statusEl = document.getElementById('status');
        const sidebar = document.getElementById('sidebar');
        const sidebarContent = document.getElementById('sidebar-content');
        const subtitle = document.getElementById('subtitle');
            
        let isRecognizing = false;
        let currentAudio = null;
        let conversationHistory = [];
        let systemVoices = [];
        
        function loadSystemVoices() { systemVoices = window.speechSynthesis.getVoices(); }
        loadSystemVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) { window.speechSynthesis.onvoiceschanged = loadSystemVoices; }
            
        function handleAutomationTags(text) { 
            const openMatches = [...text.matchAll(/<open:\s*([^>]+)>/g)];
            openMatches.forEach(m => {
                let url = m[1].trim();
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                window.open(url, '_blank');
            });
        }
        
        // Separates structural code layers from primary speech voice layers
        function evaluateSidebar(text) {
            const tripleTick = String.fromCharCode(96, 96, 96);
            if ([tripleTick, 'json', '{', 'sub_agents', 'plan', 'matrix layer', 'matrix data', 'matrix:', 'current weather:'].some(t => text.toLowerCase().includes(t))) {
                sidebar.classList.add('open');
                sidebarContent.innerHTML = `<pre>${text.replace(/<[^>]*>?/gm, '')}</pre>`; 
            } else {
                sidebar.classList.remove('open');
            }
        }
                
        function killActiveSpeechChannels() {
            window.speechSynthesis.cancel();
            if (currentAudio) {
                try { currentAudio.pause(); } catch(e) {}
                currentAudio = null;
            }
        }     

        // Continuous automatic ear listening loops for real hands-free execution
        function safeStartMic() {
            if (rec && !isRecognizing && orbState !== 'speaking' && orbState !== 'processing') {
                try { rec.start(); } catch(e) {}
            }
        }

        async function playVoice(text, audioB64) {
            orbState = 'speaking';
            handleAutomationTags(text);
            
            // UI Split: Only display clean vocal lines on the main orb interface screen
            let spokenClean = text.split(/`{3}|matrix/i)[0].replace(/<[^>]*>?/gm, '').replace(/[\*\#]/g, '').trim();
            subtitle.innerText = spokenClean;
        
            if (!statusEl.innerText.includes('ERR')) {
                statusEl.innerText = 'GHOST';
                statusEl.style.color = '#0df';
            }
                
            if (audioB64 && audioB64.length > 0) {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();   
                if (ctx.state === 'suspended') await ctx.resume();
                currentAudio = new Audio("data:audio/mp3;base64," + audioB64[0]);
                currentAudio.onended = () => { orbState = 'idle'; safeStartMic(); };
                currentAudio.play().catch(() => playNativeVoice(spokenClean));
            } else {
                playNativeVoice(spokenClean);
            }
        }
                
        function playNativeVoice(cleanText) {
            window.speechSynthesis.cancel();
            let explicitSpokenPhrase = cleanText.replace(/`{3}[\s\S]*?`{3}/g, 'Displaying execution details on screen.');
            const utterance = new SpeechSynthesisUtterance(explicitSpokenPhrase);     
            let humanFemaleVoice = systemVoices.find(v => v.lang.includes('en-GB') && /serena|martha|hazel|female/i.test(v.name));
            if (!humanFemaleVoice) humanFemaleVoice = systemVoices.find(v => v.lang.includes('en-US') && /zira|samantha|female/i.test(v.name));
                
            if (humanFemaleVoice) {
                utterance.voice = humanFemaleVoice;
                utterance.rate = 1.05;
                utterance.pitch = 1.15;
            }   
            utterance.onend = () => { orbState = 'idle'; safeStartMic(); };
            window.speechSynthesis.speak(utterance);
        } 

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || window.mozSpeechRecognition || window.msSpeechRecognition;
        let rec = null;
        if (SpeechRec) {
            rec = new SpeechRec(); 
            rec.continuous = false;
            rec.interimResults = false;
            
            rec.onstart = () => { isRecognizing = true; if(orbState === 'idle') orbState = 'listening'; statusEl.innerText = 'GHOST [LISTENING]'; };
            rec.onend = () => { isRecognizing = false; if(orbState === 'listening' || orbState === 'idle') safeStartMic(); };
            
            rec.onresult = async (e) => {
                let index = e.results.length - 1;
                let resultText = e.results[index][0].transcript;
                if (e.results[index].isFinal) {
                    processInput(resultText);
                }
            };
        }
                
        async function processInput(text) {
            if(!text.trim()) return;
            orbState = 'processing'; 
            statusEl.innerText = 'GHOST [THINKING]';
            statusEl.style.color = '#fa0';
            killActiveSpeechChannels();
                
            try {   
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 65000); 

                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: text, history: conversationHistory }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const data = await res.json();
        
                if (data.success) { 
                    conversationHistory.push({ role: 'user', content: text });
                    conversationHistory.push({ role: 'assistant', content: data.text });
                    evaluateSidebar(data.text);
                
                    if (data.audio_b64 && data.audio_b64.length === 0 && data.voice_diagnostic) {
                        statusEl.innerText = `[11LABS ERR: USING FALLBACK]`;
                        statusEl.style.color = '#fa0';
                    }
                    playVoice(data.text, data.audio_b64);
                } else {
                    statusEl.innerText = `[CORE FAILURE]`;
                    statusEl.style.color = '#f00';
                    orbState = 'error';
                    setTimeout(() => { orbState = 'idle'; statusEl.innerText = 'GHOST'; statusEl.style.color = '#0df'; safeStartMic(); }, 3000);
                }
            } catch(err) {
                statusEl.innerText = `[SERVER WAKING UP]`;
                statusEl.style.color = '#fa0';
                orbState = 'error';
                setTimeout(() => { orbState = 'idle'; statusEl.innerText = 'GHOST'; statusEl.style.color = '#0df'; safeStartMic(); }, 4000);
            }
        }
                
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            statusEl.innerText = `[READING FILE...]`;
            orbState = 'processing';
            const reader = new FileReader();
            reader.onload = function(e) {
                processInput(`[User Uploaded Document: ${file.name}]\n\nData Payload:\n${e.target.result}`);
            };
            reader.readAsDataURL(file);
        }

        function sendManual() {
            const input = document.getElementById('manual-input');
            if(!input.value.trim()) return;
            processInput(input.value);
            input.value = '';
            document.getElementById('text-fallback').classList.remove('visible');
        }

        // Auto-initialize ear listening loop on startup
        window.onload = () => { setTimeout(safeStartMic, 1000); };
    </script>
</body>
</html>
