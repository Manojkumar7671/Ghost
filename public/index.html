<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghost OS | V7 Full Deployment</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #020608; color: #0df; font-family: 'Courier New', monospace; overflow: hidden; }
        .hud-grid { position: absolute; width: 100%; height: 100%; background: linear-gradient(rgba(0, 221, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 221, 255, 0.05) 1px, transparent 1px); background-size: 40px 40px; }
        #ghost-orb { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 150px; height: 150px; background: radial-gradient(circle, rgba(0,221,255,0.3) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; border: 2px solid #0df; transition: all 0.5s ease; cursor: pointer; box-shadow: 0 0 40px rgba(0,221,255,0.4); }
        #ghost-orb.listening { border-color: #0df; box-shadow: 0 0 60px #0df; animation: pulse 2s infinite; }
        #ghost-orb.processing { border-color: #fa0; box-shadow: 0 0 60px #fa0; animation: spin 2s linear infinite; }
        #ghost-orb.speaking { border-color: #f0f; box-shadow: 0 0 60px #f0f; animation: wave 0.5s infinite alternate; }
        @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.1); } }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes wave { 0% { transform: translate(-50%, -50%) scale(1.1); } 100% { transform: translate(-50%, -50%) scale(1.3); } }
        #sidebar { position: absolute; right: -400px; top: 0; width: 400px; height: 100%; background: rgba(0,0,0,0.85); border-left: 2px solid #0df; transition: 0.5s; padding: 20px; overflow-y: auto; }
        #sidebar.open { right: 0; }
        .sys-text { position: absolute; width: 100%; text-align: center; letter-spacing: 5px; font-size: 14px; text-transform: uppercase; }
        #status { bottom: 50px; color: #555; }
    </style>
</head>
<body>
    <div class="hud-grid"></div>
    <div class="sys-text" style="top:30px;">GHOST OS v7 | CLOUD LINK ACTIVE</div>
    <div id="ghost-orb"></div>
    <div class="sys-text" id="status">CLICK ORB TO ACTIVATE</div>
    <div id="sidebar"><div id="content"></div></div>

    <script type="module">
        const orb = document.getElementById('ghost-orb');
        const status = document.getElementById('status');
        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('content');
        let currentAudio = null;

        async function playAudio(b64Array) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') await ctx.resume();
            let index = 0;
            orb.className = 'speaking';
            status.innerText = 'GHOST IS SPEAKING';
            function playNext() {
                if (index >= b64Array.length) { orb.className = 'listening'; status.innerText = 'LISTENING'; return; }
                currentAudio = new Audio("data:audio/mp3;base64," + b64Array[index]);
                currentAudio.onended = playNext;
                currentAudio.play().catch(e => playNext());
                index++;
            }
            playNext();
        }

        function initGhost() {
            orb.className = 'listening';
            status.innerText = 'LISTENING';
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            window.ghostRec = new SpeechRec();
            window.ghostRec.continuous = true;
            window.ghostRec.interimResults = false;
            window.ghostRec.onresult = async (e) => {
                const text = e.results[e.results.length-1][0].transcript;
                orb.className = 'processing';
                status.innerText = 'PROCESSING...';
                const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text }) });
                const data = await res.json();
                if (data.success) {
                    if (data.text.includes('code') || data.isSwarm) { sidebar.classList.add('open'); content.innerText = data.text; }
                    playAudio(data.audio_b64);
                }
            };
            window.ghostRec.onend = () => window.ghostRec.start();
            window.ghostRec.start();
        }
        orb.addEventListener('click', initGhost, { once: true });
    </script>
</body>
</html>
