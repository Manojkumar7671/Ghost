<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghost OS v19</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #0df; font-family: monospace; overflow: hidden; user-select: none; }
        #overlay { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; }
        .sys-text { letter-spacing: 5px; font-size: 24px; font-weight: bold; text-transform: uppercase; text-shadow: 0 0 10px #0df; }
        #subtitle { position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%); width: 70%; text-align: center; font-size: 1.2em; line-height: 1.5; color: #0df; z-index: 10; text-shadow: 0 0 5px #0df; }
        
        /* SIDEBAR STYLES */
        #sidebar { position: absolute; right: -450px; top: 0; width: 450px; height: 100%; background: rgba(0, 0, 0, 0.95); border-left: 2px solid #0df; padding: 20px; box-sizing: border-box; transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 20; overflow-y: auto; }
        #sidebar.open { right: 0; }
        .sidebar-header { display: flex; justify-content: space-between; border-bottom: 1px solid #0df; padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; letter-spacing: 2px; }
        #sidebar-content { font-size: 0.9em; color: #aaa; line-height: 1.5; white-space: pre-wrap; }
        .close-btn { cursor: pointer; color: #0df; font-weight: bold; border: 1px solid #0df; padding: 2px 8px; }
        .close-btn:hover { background: #0df; color: #000; }
        
        #text-fallback { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; gap: 10px; }
        input[type="text"] { background: rgba(0,0,0,0.8); border: 1px solid #0df; color: #0df; padding: 10px; width: 300px; font-family: monospace; outline: none; }
        .run-btn { background: #0df; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; font-family: monospace; }
    </style>
</head>
<body>
    <div id="overlay"><div class="sys-text" id="status">GHOST V19</div></div>
    <div id="subtitle"></div>
    
    <div id="sidebar">
        <div class="sidebar-header">
            MATRIX PAYLOAD <span class="close-btn" onclick="closeSidebar()">X</span>
        </div>
        <div id="sidebar-content"></div>
    </div>
    
    <div id="text-fallback">
        <input type="text" id="manual-input" placeholder="Execute command..." onkeypress="if(event.key === 'Enter') sendManual()">
        <button class="run-btn" onclick="sendManual()">RUN</button>
    </div>

    <script>
        // THREE.JS ORB CODE (Preserved)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // ... (Keep existing particle logic from previous versions) ...
        camera.position.z = 5.5; 
        
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

        async function processResponse(fullText) {
            // THE SPLIT LOGIC: This stops the echoing
            const parts = fullText.split(/matrix/i);
            const voiceText = parts[0].trim();
            const matrixData = parts[1] ? parts[1].trim() : null;
            
            // 1. Display Voice Layer
            document.getElementById('subtitle').innerText = voiceText;
            
            // 2. Display Matrix Layer
            const sidebar = document.getElementById('sidebar');
            const sidebarContent = document.getElementById('sidebar-content');
            
            if (matrixData) {
                sidebarContent.innerHTML = `<pre>${matrixData.replace(/```/g, '')}</pre>`;
                sidebar.classList.add('open');
            }
        }

        async function sendManual() {
            const input = document.getElementById('manual-input');
            if(!input.value.trim()) return;
            
            document.getElementById('status').innerText = 'GHOST [THINKING]';
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: input.value, history: [] })
            });
            const data = await res.json();
            
            if(data.success) {
                processResponse(data.text);
                document.getElementById('status').innerText = 'GHOST';
            }
            input.value = '';
        }
    </script>
</body>
</html>
