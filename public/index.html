<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost OS</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000000 !important; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', Courier, monospace; }
        #ghost-orb { width: 80px; height: 80px; background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; box-shadow: 0 0 20px rgba(255,255,255,0.2); transition: all 0.3s ease; cursor: pointer; }
        #ghost-orb.listening { box-shadow: 0 0 40px rgba(0,255,255,0.6); animation: pulse 2s infinite; }
        #ghost-orb.speaking { box-shadow: 0 0 40px rgba(255,0,255,0.6); transform: scale(1.1); }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.6; } }
    </style>
</head>
<body>
<div id="ghost-orb"></div>
<script>
    let conversationHistory = [];
    const orb = document.getElementById('ghost-orb');
    let audioCtx;

    function lockAudioEngine() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
        }
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        let cleanText = text.replace(/<open:.*?>|<search:.*?>/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        const voices = window.speechSynthesis.getVoices();
        const britishVoice = voices.find(v => v.lang.includes('en-GB')) || voices[0];
        if (britishVoice) utterance.voice = britishVoice;
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.onstart = () => { orb.className = 'speaking'; if(window.ghostRec) window.ghostRec.abort(); };
        utterance.onend = () => { orb.className = 'listening'; executeEmbeddedTags(text); restartMicLoop(); };
        window.speechSynthesis.speak(utterance);
    }

    function executeEmbeddedTags(rawText) {
        const openMatch = rawText.match(/<open:\s*(https?:\/\/[^\s>]+)>/);
        const searchMatch = rawText.match(/<search:\s*([^>]+)>/);
        if (openMatch) window.open(openMatch[1], '_blank');
        else if (searchMatch) window.open('https://www.google.com/search?q=' + encodeURIComponent(searchMatch[1].trim()), '_blank');
    }

    function initGhostVoiceSystem() {
        lockAudioEngine();
        orb.className = 'listening';
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            window.ghostRec = new SpeechRec();
            window.ghostRec.continuous = false;
            window.ghostRec.interimResults = false;
            window.ghostRec.lang = 'en-US';
            window.ghostRec.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                orb.className = '';
                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: transcript, history: conversationHistory })
                    });
                    const data = await response.json();
                    if (data.success) {
                        if (data.isSwarm) {
                            console.log("Swarm Engine Engaged:", data.swarm);
                            speak("Swarm protocols initialized, Sir. Processing parallel agent nodes.");
                        } else {
                            speak(data.text);
                            conversationHistory.push({ role: 'user', parts: [{ text: transcript }] });
                            conversationHistory.push({ role: 'model', parts: [{ text: data.text }] });
                        }
                    }
                } catch (err) { restartMicLoop(); }
            };
            window.ghostRec.onend = () => setTimeout(() => restartMicLoop(), 100);
            try { window.ghostRec.start(); } catch(e) {}
        }
    }

    function restartMicLoop() {
        if (window.speechSynthesis.speaking) return;
        try { window.ghostRec.start(); } catch(e) {}
    }

    document.addEventListener('click', initGhostVoiceSystem, { once: true });
    window.speechSynthesis.onvoiceschanged = window.speechSynthesis.getVoices;
</script>
</body>
</html>
