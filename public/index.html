<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost OS Terminal</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505; /* Deep space black */
            color: #00ffcc; /* Ghost's matrix/hacker green-blue */
            font-family: 'Courier New', Courier, monospace;
        }
        
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none; /* Let clicks pass through to the 3D scene if needed */
        }

        #chat-log {
            padding: 2rem;
            max-height: 70vh;
            overflow-y: auto;
            pointer-events: auto;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
        }

        .message { margin-bottom: 1rem; line-height: 1.4; }
        .boss-msg { color: #ffffff; opacity: 0.8; }
        .ghost-msg { color: #00ffcc; font-weight: bold; }

        #input-container {
            padding: 2rem;
            pointer-events: auto;
            background: linear-gradient(to top, rgba(5,5,5,1) 50%, rgba(5,5,5,0));
        }

        #command-input {
            width: 100%;
            max-width: 600px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            padding: 10px 5px;
            outline: none;
            transition: border-color 0.3s;
        }

        #command-input:focus {
            border-bottom: 1px solid #00ffcc;
            box-shadow: 0 10px 10px -10px rgba(0, 255, 204, 0.5);
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <div id="ui-layer">
        <div id="chat-log">
            <div class="message ghost-msg">System initialized. Awaiting input.</div>
        </div>
        <div id="input-container">
            <input type="text" id="command-input" placeholder="Type command..." autocomplete="off" autofocus>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="ghost-ui.js"></script>
</body>
</html>
