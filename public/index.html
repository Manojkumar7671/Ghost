<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghost OS | Neural Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #0df; font-family: 'Courier New', monospace; overflow: hidden; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 30px; box-sizing: border-box; z-index: 10; }
        .sys-text { text-align: center; letter-spacing: 5px; font-size: 14px; text-transform: uppercase; text-shadow: 0 0 10px rgba(0, 221, 255, 0.5); }
        #status { color: #888; }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="sys-text">GHOST OS | NEURAL INTERFACE</div>
        <div class="sys-text" id="status">SYSTEM OFFLINE: CLICK ANYWHERE TO INITIALIZE</div>
    </div>

    <script>
        // --- 1. 3D PARTICLE SPHERE SETUP (THREE.JS) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const particlesCount = 4000;
        const posArray = new Float32Array(particlesCount * 3);

        // Create a sphere of particles
        for(let i = 0; i < particlesCount * 3; i+=3) {
            const r = 2.5;
            const theta = 2 * Math.PI * Math.random();
            const phi = Math.acos(2 * Math.random() - 1);
            posArray[i] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = r * Math.cos(phi);
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const material = new THREE.PointsMaterial({ size: 0.02, color: 0x00ddff, transparent: true, opacity: 0.8 });
        const particlesMesh = new THREE.Points(geometry, material);
        scene.add(particlesMesh);
        camera.position.z = 6;

        let orbState = 'idle'; // idle, listening, processing, speaking
        let clock = new THREE.Clock();

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            
            // Default idle rotation
            particlesMesh.rotation.y += 0.002;
            particlesMesh.rotation.x += 0.001;

            if (orbState === 'processing') {
                material.color.setHex(0xffaa00); // Orange
                particlesMesh.rotation.y += 0.03; // Spin faster
                particlesMesh.scale.set(1, 1, 1);
            } else if (orbState === 'speaking') {
                material.color.setHex(0x00ddff); // Blue
                const pulse = 1 + Math.sin(elapsedTime * 8) * 0.15; // Voice wave effect
                particlesMesh.scale.set(pulse, pulse, pulse);
            } else if (orbState === 'listening') {
                material.color.setHex(0x00ddff); // Blue
                particlesMesh.scale.set(1, 1, 1);
            }

            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 2. GHOST LOGIC & MIC SAFETY ---
        const statusEl = document.getElementById('status');
        let isRecognizing = false;

        function speak(text) {
            orbState = 'speaking';
            window.speechSynthesis.cancel();
            
            // Clean text for speaking
            const cleanText = text.replace(/<[^>]*>?/gm, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            
            utterance.onend = () => {
                orbState = 'listening';
                statusEl.innerText = 'LISTENING...';
                safeStartMic();
            };
            window.speechSynthesis.speak(utterance);
        }

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SpeechRec();
        rec.continuous = false; // Set to false to avoid the InvalidStateError loop
        rec.interimResults = false;

        rec.onstart = () => { 
            isRecognizing = true; 
            orbState = 'listening'; 
            statusEl.innerText = 'LISTENING...'; 
            statusEl.style.color = '#0df';
        };
        
        rec.onend = () => { 
            isRecognizing = false; 
            // Only restart if Ghost isn't busy thinking or talking
            if(orbState === 'listening') safeStartMic(); 
        };

        rec.onerror = (e) => {
            isRecognizing = false;
        };
        
        rec.onresult = async (e) => {
            const text = e.results[0][0].transcript;
            orbState = 'processing';
            statusEl.innerText = 'PROCESSING...';
            statusEl.style.color = '#fa0';
            
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: text, history: [] })
                });
                const data = await res.json();
                if(data.success) {
                    speak(data.text);
                }
            } catch(err) {
                statusEl.innerText = 'CONNECTION FAILED';
                orbState = 'listening';
                safeStartMic();
            }
        };

        // SAFETY LOCK: Prevents the "recognition has already started" error
        function safeStartMic() {
            if (!isRecognizing) {
                try { rec.start(); } catch(e) {}
            }
        }

        // Initialize on first click
        document.body.addEventListener('click', () => {
            if(orbState === 'idle') {
                safeStartMic();
            }
        }, { once: true });
    </script>
</body>
</html>
