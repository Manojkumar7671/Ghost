<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost OS // Core</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --core-cyan: #00f3ff;
            --core-blue: #0055ff;
            --alert: #ff2e4d;
            --violet: #b14bff;
            --bg: #020202;
            --panel: rgba(5, 8, 12, 0.85);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg);
            color: var(--core-cyan);
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* --- LOGIN OVERLAY --- */
        #loginOverlay {
            position: absolute; inset: 0; z-index: 100;
            background: rgba(2, 2, 2, 0.95);
            backdrop-filter: blur(20px);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #loginOverlay h1 {
            font-size: 24px; letter-spacing: 0.3em; font-weight: 300;
            margin-bottom: 40px; text-shadow: 0 0 20px var(--core-cyan);
        }
        #authInput {
            background: transparent; border: none;
            border-bottom: 2px solid rgba(0, 243, 255, 0.3);
            color: #fff; font-size: 18px; text-align: center;
            padding: 10px; width: 350px; outline: none;
            font-family: inherit; letter-spacing: 0.1em;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        #authInput:focus {
            border-bottom-color: var(--core-cyan);
            box-shadow: 0 10px 20px -10px var(--core-cyan);
        }

        /* --- MAIN OS CONTAINER --- */
        #os-container {
            position: absolute; inset: 0; z-index: 10;
            display: flex; opacity: 0; visibility: hidden;
            transition: opacity 1s ease 0.5s; 
        }
        #os-container.active { opacity: 1; visibility: visible; }

        /* --- 3D CANVAS & HUD --- */
        #canvas-container { flex: 1; position: relative; cursor: crosshair; }
        #canvas-container::after {
            content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
        }

        .status-bar {
            position: absolute; top: 25px; left: 25px; z-index: 12;
            display: flex; gap: 15px; font-size: 11px; font-weight: bold; letter-spacing: 0.15em;
        }
        .tag {
            padding: 6px 12px; border-radius: 4px; display: flex; align-items: center; gap: 8px;
            background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1) inset;
        }
        .tag.admin { border-color: var(--alert); color: var(--alert); box-shadow: 0 0 15px rgba(255, 46, 77, 0.1) inset; }
        
        /* Interactive Ghost Code Button */
        .tag.ghost-code { 
            border-color: var(--violet); color: var(--violet); box-shadow: 0 0 15px rgba(177, 75, 255, 0.1) inset;
            cursor: pointer; transition: all 0.3s ease;
        }
        .tag.ghost-code:hover { box-shadow: 0 0 25px rgba(177, 75, 255, 0.3) inset; }
        .tag.ghost-code.off { opacity: 0.4; box-shadow: none; border-color: rgba(177, 75, 255, 0.3); }
        
        .dot { width: 6px; height: 6px; border-radius: 50%; animation: pulse 2s infinite; }
        .dot.cyan { background: var(--core-cyan); box-shadow: 0 0 8px var(--core-cyan); }
        .dot.red { background: var(--alert); box-shadow: 0 0 8px var(--alert); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* --- SUBTITLE HUD --- */
        #subtitle-hud {
            position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
            width: 70%; text-align: center; z-index: 11; pointer-events: none;
            font-size: 15px; line-height: 1.6; letter-spacing: 0.05em; color: #fff;
            text-shadow: 0 2px 10px rgba(0, 243, 255, 0.5);
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.6), transparent);
            padding: 20px; opacity: 0; transition: opacity 0.3s;
        }

        /* --- HIDDEN INPUT BAR --- */
        #input-area {
            position: absolute; bottom: 30px; left: 50%; transform: translate(-50%, 20px);
            z-index: 20; display: flex; align-items: center; gap: 12px;
            background: var(--panel); backdrop-filter: blur(15px);
            padding: 12px 20px; border-radius: 30px; width: 60%; max-width: 800px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(0, 243, 255, 0.1) inset;
            opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #input-area.visible { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
        
        #input-area input[type="text"] {
            flex: 1; background: transparent; border: none; color: #fff;
            font-family: inherit; font-size: 14px; outline: none;
        }
        #input-area input::placeholder { color: rgba(0, 243, 255, 0.4); }
        #input-area button {
            background: transparent; border: none; color: var(--core-cyan); cursor: pointer;
            font-size: 18px; transition: 0.2s;
        }
        #input-area button:hover { transform: scale(1.1); text-shadow: 0 0 10px var(--core-cyan); }
        #sendBtn { 
            font-size: 12px !important; font-weight: bold; letter-spacing: 0.1em;
            border: 1px solid var(--core-cyan) !important; padding: 6px 14px; border-radius: 15px;
        }

        /* --- CODE SIDEBAR --- */
        #code-sidebar {
            position: absolute; right: -500px; top: 0; bottom: 0; width: 450px; z-index: 30;
            background: var(--panel); backdrop-filter: blur(20px);
            border-left: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: -20px 0 50px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; transition: right 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #code-sidebar.open { right: 0; }
        
        #sidebar-header {
            padding: 20px; border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 12px; letter-spacing: 0.2em;
        }
        #closeSidebar { cursor: pointer; color: var(--alert); font-size: 16px; }
        #closeSidebar:hover { text-shadow: 0 0 10px var(--alert); }
        
        #code-content { flex: 1; overflow-y: auto; padding: 20px; font-size: 13px; }
        pre {
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 6px;
            border: 1px solid rgba(0, 243, 255, 0.2); overflow-x: auto;
            color: #e0e0e0; margin-bottom: 20px;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 5px; }

    </style>
</head>
<body>

<div id="loginOverlay">
    <h1>GHOST OS</h1>
    <input type="text" id="authInput" placeholder="Identify yourself..." autocomplete="off" autofocus />
</div>

<div id="os-container">
    <div id="canvas-container">
        <div class="status-bar">
            <span class="tag" id="userTag"><span class="dot cyan"></span>GUEST // ACTIVE</span>
            <span class="tag"><span class="dot cyan" id="micIndicator"></span>MIC // LISTENING</span>
            <span class="tag ghost-code" id="ghostCodeBtn">[ GHOST CODE: ON ]</span>
        </div>

        <div id="subtitle-hud">Ghost systems initialized. Awaiting voice protocol.</div>

        <div id="input-area">
            <button id="attachBtn" title="Upload Media">📎</button>
            <input type="file" id="attachmentInput" style="display: none;" />
            <input type="text" id="userInput" placeholder="Manual command override..." autocomplete="off" />
            <button id="sendBtn">EXECUTE</button>
        </div>
    </div>

    <div id="code-sidebar">
        <div id="sidebar-header">
            <span>COMPILED CODE DATA</span>
            <span id="closeSidebar">✕</span>
        </div>
        <div id="code-content"></div>
    </div>
</div>

<script>
// Wrap everything in DOMContentLoaded so HTML elements are parsed before the script fires
document.addEventListener('DOMContentLoaded', () => {

    console.log("Ghost Matrix Shell Initializing...");

    // --- 1. AUTHENTICATION LOGIC ---
    const loginOverlay = document.getElementById('loginOverlay');
    const authInput = document.getElementById('authInput');
    const osContainer = document.getElementById('os-container');
    const userTag = document.getElementById('userTag');
    
    let masterUser = "Guest";

    authInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const inputVal = authInput.value.trim();
            if (!inputVal) return;

            if (inputVal.toLowerCase() === 'knightfall') {
                // ADMIN PROTOCOL
                userTag.innerHTML = `<span class="dot red"></span>ADMIN // ACTIVE`;
                userTag.classList.add('admin');
                masterUser = "Master Manoj";
                speakResponse("Welcome back, Master Manoj. Ghost OS online. All subsystems operating at maximum capacity.");
            } else {
                // GUEST PROTOCOL 
                userTag.innerHTML = `<span class="dot cyan"></span>GUEST // ${inputVal.toUpperCase()}`;
                masterUser = inputVal;
                speakResponse(`Welcome, ${inputVal}. I am Ghost, a proprietary AI architecture engineered by Manoj Kumar. My logic, vision, and execution modules are currently at your disposal. Speak my name to initiate a voice command, or double-tap the interface for manual entry.`);
            }
            
            loginOverlay.style.opacity = '0';
            loginOverlay.style.visibility = 'hidden';
            osContainer.classList.add('active');
            
            setTimeout(startContinuousListening, 1000);
        }
    });

    // --- 1.5 INTERACTIVE GHOST CODE TOGGLE ---
    let isGhostCodeActive = true;
    const ghostCodeBtn = document.getElementById('ghostCodeBtn');
    
    ghostCodeBtn.addEventListener('click', () => {
        isGhostCodeActive = !isGhostCodeActive;
        if (isGhostCodeActive) {
            ghostCodeBtn.classList.remove('off');
            ghostCodeBtn.innerText = "[ GHOST CODE: ON ]";
            speakResponse("Ghost Code execution module activated.");
        } else {
            ghostCodeBtn.classList.add('off');
            ghostCodeBtn.innerText = "[ GHOST CODE: OFF ]";
            speakResponse("Ghost Code execution module offline.");
        }
    });

    // --- 2. THE J.A.R.V.I.S SPHERE (Three.js) ---
    if (typeof THREE !== 'undefined') {
        const canvasContainer = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.zIndex = '1';
        canvasContainer.appendChild(renderer.domElement);

        const particleCount = 8000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const colorCyan = new THREE.Color('#00f3ff');
        const colorBlue = new THREE.Color('#0055ff');

        for(let i = 0; i < particleCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const radius = 5 + (Math.random() * 0.5); 

            positions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i*3+2] = radius * Math.cos(phi);

            const mixedColor = Math.random() > 0.5 ? colorCyan : colorBlue;
            colors[i*3] = mixedColor.r;
            colors[i*3+1] = mixedColor.g;
            colors[i*3+2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.03,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const sphereMesh = new THREE.Points(geometry, material);
        scene.add(sphereMesh);

        const coreGeo = new THREE.SphereGeometry(4.5, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x0055ff, transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        scene.add(coreMesh);

        camera.position.z = 12;

        let time = 0;
        function animateSphere() {
            requestAnimationFrame(animateSphere);
            time += 0.005;
            
            sphereMesh.rotation.y += 0.002;
            sphereMesh.rotation.x = Math.sin(time) * 0.2; 
            
            const scale = 1 + Math.sin(time * 2) * 0.02;
            sphereMesh.scale.set(scale, scale, scale);
            coreMesh.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }
        animateSphere();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    } else {
        console.error("Matrix Error: Three.js engine failed to load.");
    }

    // --- 3. UI INTERACTIONS ---
    let inputVisible = false;
    let lastTap = 0;
    const inputArea = document.getElementById('input-area');
    const codeSidebar = document.getElementById('code-sidebar');
    const codeContent = document.getElementById('code-content');
    const subtitleHud = document.getElementById('subtitle-hud');

    function handleDoubleTap(e) {
        if(e.target.closest('#input-area') || e.target.closest('#code-sidebar')) return;
        
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        if (tapLength < 300 && tapLength > 0) {
            inputVisible = !inputVisible;
            if (inputVisible) {
                inputArea.classList.add('visible');
                document.getElementById('userInput').focus();
            } else {
                inputArea.classList.remove('visible');
            }
        }
        lastTap = currentTime;
    }
    
    document.addEventListener('dblclick', (e) => { lastTap = new Date().getTime() - 100; handleDoubleTap(e); });
    document.addEventListener('touchend', handleDoubleTap);

    document.getElementById('closeSidebar').addEventListener('click', () => {
        codeSidebar.classList.remove('open');
    });

    let subtitleTimeout;
    function showSubtitle(text) {
        subtitleHud.innerText = text;
        subtitleHud.style.opacity = '1';
        clearTimeout(subtitleTimeout);
        subtitleTimeout = setTimeout(() => { subtitleHud.style.opacity = '0'; }, Math.max(3000, text.length * 50));
    }

    // --- 4. VOICE SYNTHESIS ---
    function speakResponse(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel(); 
        
        const utterance = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        utterance.voice = voices.find(v => v.name.includes('UK English Male') || v.name.includes('Google UK English')) || voices[0];
        utterance.rate = 1.05;
        utterance.pitch = 0.9;
        
        showSubtitle(text);
        window.speechSynthesis.speak(utterance);
    }

    // --- 5. CONTINUOUS VOICE RECOGNITION ---
    const micIndicator = document.getElementById('micIndicator');
    let recognition;
    let isProcessingCommand = false;

    function startContinuousListening() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            showSubtitle("Microphone hardware not supported in this browser.");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => { micIndicator.classList.add('cyan'); micIndicator.classList.remove('red'); };
        
        recognition.onresult = (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
            
            if (transcript.includes("ghost") && !isProcessingCommand) {
                const command = transcript.split("ghost").pop().trim();
                if (command.length > 2) {
                    processCommand(command);
                } else {
                    speakResponse("Yes?");
                }
            }
        };

        recognition.onerror = (event) => {
            if(event.error === 'not-allowed') micIndicator.classList.add('red');
        };

        recognition.onend = () => {
            if(!isProcessingCommand) {
                try { recognition.start(); } catch(e){}
            }
        };

        try { recognition.start(); } catch(e){}
    }

    // --- 6. DATA GATHERING & BACKEND CONNECTION ---
    let uploadedFileText = "";
    let uploadedImageBase64 = "";
    const attachmentInput = document.getElementById('attachmentInput');
    
    document.getElementById('attachBtn').addEventListener('click', () => attachmentInput.click());
    
    attachmentInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        if (file.type.startsWith('image/')) {
            reader.onload = (ev) => { 
                uploadedImageBase64 = ev.target.result.split(',')[1]; 
                showSubtitle(`Media buffered: ${file.name}`);
            };
            reader.readAsDataURL(file);
        } else {
            reader.onload = (ev) => { 
                uploadedFileText = ev.target.result; 
                showSubtitle(`Data buffered: ${file.name}`);
            };
            reader.readAsText(file);
        }
    });

    document.getElementById('sendBtn').addEventListener('click', () => {
        const val = document.getElementById('userInput').value;
        if(val || uploadedImageBase64 || uploadedFileText) processCommand(val);
    });
    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = document.getElementById('userInput').value;
            if(val || uploadedImageBase64 || uploadedFileText) processCommand(val);
        }
    });

    async function processCommand(textCommand) {
        isProcessingCommand = true;
        if(recognition) recognition.stop(); 
        
        showSubtitle("Processing...");
        document.getElementById('userInput').value = "";
        inputArea.classList.remove('visible'); inputVisible = false;

        const payload = {
            message: textCommand,
            user: masterUser,
            image: uploadedImageBase64 || null,
            fileContent: uploadedFileText || null,
            ghostCodeMode: isGhostCodeActive 
        };

        uploadedFileText = ""; uploadedImageBase64 = ""; attachmentInput.value = "";

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            
            if (data.success) {
                handleGhostResponse(data.text);
            } else {
                speakResponse("Matrix error. Backend disconnected.");
            }
        } catch (error) {
            speakResponse("Critical failure. Server unreachable.");
        } finally {
            isProcessingCommand = false;
            setTimeout(() => { try { recognition.start(); } catch(e){} }, 1000);
        }
    }

    // --- 7. PARSE RESPONSE ---
    function handleGhostResponse(fullText) {
        // Safe hex codes replacing the backticks to prevent syntax errors
        const codeRegex = /[\x60]{3}[\s\S]*?[\x60]{3}/g;
        const codeBlocks = fullText.match(codeRegex);
        
        let spokenText = fullText.replace(codeRegex, '').trim();
        spokenText = spokenText.replace(/[*#_]/g, ''); 

        if (codeBlocks && codeBlocks.length > 0) {
            codeContent.innerHTML = ''; 
            codeBlocks.forEach(block => {
                let safeBlock = block.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                safeBlock = safeBlock.replace(/[\x60]{3}(.*?)\n([\s\S]*?)[\x60]{3}/, '<pre data-lang="$1"><code>$2</code></pre>');
                codeContent.innerHTML += safeBlock;
            });
            codeSidebar.classList.add('open');
            
            if(!spokenText) spokenText = "Code compiled and displayed in the sidebar, sir.";
        }

        speakResponse(spokenText || "Task complete.");
    }

    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

}); // End of DOMContentLoaded
</script>
</body>
</html>
