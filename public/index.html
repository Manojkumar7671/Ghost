<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghost OS v17</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #0df; font-family: 'Courier New', monospace; overflow: hidden; user-select: none; }
        #overlay { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; pointer-events: none; width: 90%; }
        .sys-text { letter-spacing: 5px; font-size: 24px; font-weight: bold; text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 221, 255, 0.6); color: #0df; transition: color 0.3s; }
        #subtitle { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); width: 80%; text-align: center; color: #0df; font-size: 18px; font-weight: bold; text-shadow: 0 0 10px rgba(0,221,255,0.8); pointer-events: none; min-height: 50px; line-height: 1.6; }
        #sidebar { position: absolute; right: -450px; top: 0; width: 400px; height: 100%; background: rgba(0, 0, 0, 0.95); border-left: 1px solid #0df; transition: right 0.4s cubic-bezier(0.1, 0.8, 0.1, 1); z-index: 20; padding: 20px; box-sizing: border-box; overflow-y: auto; pointer-events: auto; }
        #sidebar.open { right: 0; }
        .sidebar-header { border-bottom: 1px solid rgba(0,221,255,0.4); padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
        #sidebar-content { font-size: 0.9em; color: #aaa; line-height: 1.5; white-space: pre-wrap; }
        #text-fallback { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; display: flex; gap: 10px; }
        #text-fallback.visible { opacity: 1; pointer-events: auto; }
        #text-fallback input { background: rgba(0,0,0,0.8); border: 1px solid #0df; color: #0df; padding: 12px; width: 350px; font-family: inherit; outline: none; box-shadow: 0 0 10px rgba(0,221,255,0.2); }
        #text-fallback button { background: #0df; color: #000; border: none; padding: 12px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="overlay"><div class="sys-text" id="status">GHOST V17</div></div>
    <div id="subtitle"></div>
    <div id="sidebar"><div class="sidebar-header">MATRIX OVERRIDE</div><div id="sidebar-content"></div></div>
    <div id="text-fallback"><input type="text" id="manual-input" placeholder="Execute command..." onkeypress="if(event.key === 'Enter') sendManual()"><button onclick="sendManual()">RUN</button></div>

    <script>
        setInterval(() => { fetch('/ping').catch(() => {}); }, 120000);

        // --- CORE GRAPHICS LOGIC ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const particlesCount = 4500;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i+=3) {
            const r = 2.3, theta = 2 * Math.PI * Math.random(), phi = Math.acos(2 * Math.random() - 1);
            posArray[i] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = r * Math.cos(phi);
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const material = new THREE.PointsMaterial({ size: 0.02, color: 0x00ddff, transparent: true, opacity: 0.8 });
        const particlesMesh = new THREE.Points(geometry, material);
        scene.add(particlesMesh);
        camera.position.z = 5.5;

        let orbState = 'idle';
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.002;
            particlesMesh.rotation.x += 0.001;
            if (orbState === 'processing') { material.color.setHex(0xffaa00); particlesMesh.rotation.y += 0.04; }
            else if (orbState === 'speaking') { material.color.setHex(0x00ddff); const p = 1 + Math.sin(clock.getElapsedTime() * 10) * 0.12; particlesMesh.scale.set(p, p, p); }
            else if (orbState === 'error') { material.color.setHex(0xff0000); particlesMesh.scale.set(1, 1, 1); }
            else { material.color.setHex(0x00ddff); particlesMesh.scale.set(1, 1, 1); }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

        // --- CHANNELS & AUTOMATION ---
        const statusEl = document.getElementById('status');
        const textFallback = document.getElementById('text-fallback');
        const sidebar = document.getElementById('sidebar');
        const sidebarContent = document.getElementById('sidebar-content');
        const subtitle = document.getElementById('subtitle');
        
        let isRecognizing = false;
        let currentAudio = null;
        let conversationHistory = [];
        let systemVoices = [];

        function loadSystemVoices() {
            systemVoices = window.speechSynthesis.getVoices();
        }
        loadSystemVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadSystemVoices;
        }

        // CONTROL PROTOCOL: Disables raw web opening for research tags, locks it down strictly to explicit url open requests
        function handleAutomationTags(text) {
            const openMatches = [...text.matchAll(/<open:\s*([^>]+)>/g)];
            openMatches.forEach(m => {
                let url = m[1].trim();
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                window.open(url, '_blank');
            });
        }

        // SIDEBAR DESK MONITORING: Dynamically opens for lists, script sheets, and markdown modules
        function evaluateSidebar(text) {
            const cleanProse = text.replace(/<[^>]*>?/gm, '');
            if (['code', 'script', 'function', 'python', '```', 'json', '{', '1.', '2.', '*', '-', '##'].some(t => text.toLowerCase().includes(t))) {
                sidebar.classList.add('open');
                sidebarContent.innerHTML = cleanProse;
            } else {
                sidebar.classList.remove('open');
            }
        }

        async function playVoice(text, audioB64) {
            orbState = 'speaking';
            handleAutomationTags(text);
            
            // Format subtitles smoothly by pulling out structural markdown wrappers
            const displayFiltered = text.replace(/<[^>]*>?/gm, '').replace(/[\*\#]/g, '');
            subtitle.innerText = displayFiltered;
            
            if (!statusEl.innerText.includes('ERR')) {
                statusEl.innerText = 'GHOST V17';
                statusEl.style.color = '#0df';
            }
            
            if (audioB64 && audioB64.length > 0) {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') await ctx.resume();
                currentAudio = new Audio("data:audio/mp3;base64," + audioB64[0]);
                currentAudio.onended = () => { orbState = 'listening'; safeStartMic(); };
                currentAudio.play().catch(() => playNativeVoice(text));
            } else {
                playNativeVoice(text);
            }
        }

        function playNativeVoice(text) {
            window.speechSynthesis.cancel();
            
            // Deep scrub text to prevent engine from pronouncing internal markdown design characters aloud
            let explicitSpokenPhrase = text.replace(/<[^>]*>?/gm, '')
                                           .replace(/\*\*+/g, '')
                                           .replace(/\#+/g, '')
                                           .replace(/```[\s\S]*?```/g, 'Displaying execution summary on your data display matrix, Boss.');
            
            const utterance = new SpeechSynthesisUtterance(explicitSpokenPhrase);
            
            // TITANIUM FALLBACK SELECTION MATRIX: Scans and locks browser onto high-tier native female profiles
            let humanFemaleVoice = systemVoices.find(v => v.lang.includes('en-GB') && /serena|martha|hazel|female/i.test(v.name.toLowerCase()));
            if (!humanFemaleVoice) humanFemaleVoice = systemVoices.find(v => v.lang.includes('en-US') && /zira|samantha|jessa|monica|female/i.test(v.name.toLowerCase()));
            if (!humanFemaleVoice) humanFemaleVoice = systemVoices.find(v => v.lang.toLowerCase().includes('en') && /female|girl|lady/i.test(v.name.toLowerCase()));
            if (!humanFemaleVoice) humanFemaleVoice = systemVoices.find(v => v.lang.toLowerCase().includes('en'));
            
            if (humanFemaleVoice) {
                utterance.voice = humanFemaleVoice;
                utterance.rate = 1.05; // Tightens vocal pauses
                utterance.pitch = 1.12; // Modulates natural frequency curve to break robotic flatline
            }

            utterance.onend = () => { orbState = 'listening'; safeStartMic(); };
            window.speechSynthesis.speak(utterance);
        }

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        let rec = null;
        if (SpeechRec) {
            rec = new SpeechRec();
            rec.continuous = true;
            rec.interimResults = false;

            rec.onstart = () => { isRecognizing = true; orbState = 'listening'; statusEl.innerText = 'GHOST'; statusEl.style.color = '#0df'; };
            rec.onend = () => { isRecognizing = false; if(orbState === 'listening') safeStartMic(); };
            rec.onerror = () => { isRecognizing = false; };
            rec.onresult = async (e) => {
                const resultText = e.results[e.results.length - 1][0].transcript;
                processInput(resultText);
            };
        }

        async function processInput(text) {
            if(!text.trim()) return;
            orbState = 'processing';
            statusEl.innerText = 'GHOST [THINKING]';
            window.speechSynthesis.cancel();
            if(currentAudio) currentAudio.pause();
            
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: text, history: conversationHistory })
                });
                const data = await res.json();
                
                if (data.success) {
                    conversationHistory.push({ role: 'user', content: text });
                    conversationHistory.push({ role: 'assistant', content: data.text });
                    evaluateSidebar(data.text);
                    
                    if (data.audio_b64.length === 0 && data.voice_diagnostic) {
                        statusEl.innerText = `[11LABS ERR: CHECK CREDITS]`;
                        statusEl.style.color = '#fa0';
                    }
                    playVoice(data.text, data.audio_b64);
                } else {
                    statusEl.innerText = `[CORE FAILURE]`;
                    statusEl.style.color = '#f00';
                    orbState = 'error';
                    setTimeout(() => { orbState = 'listening'; statusEl.innerText = 'GHOST'; statusEl.style.color = '#0df'; safeStartMic(); }, 4000);
                }
            } catch(err) {
                statusEl.innerText = `[LATENCY TIMEOUT]`;
                statusEl.style.color = '#fa0';
                orbState = 'error';
                setTimeout(() => { orbState = 'listening'; statusEl.innerText = 'GHOST'; statusEl.style.color = '#0df'; safeStartMic(); }, 4000);
            }
        }

        function sendManual() {
            const input = document.getElementById('manual-input');
            if(!input.value.trim()) return;
            processInput(input.value);
            input.value = '';
            document.getElementById('text-fallback').classList.remove('visible');
        }

        function safeStartMic() {
            if (rec && !isRecognizing && orbState !== 'speaking' && orbState !== 'processing' && orbState !== 'error') {
                try { rec.start(); } catch(e) {}
            }
        }

        setInterval(() => {
            if (orbState === 'listening' && !isRecognizing) safeStartMic();
        }, 1000);

        let lastTap = 0;
        document.body.addEventListener('click', (e) => {
            if(e.target.closest('#text-fallback') || e.target.closest('#sidebar')) return;
            const now = new Date().getTime();
            if (now - lastTap < 300) {
                textFallback.classList.toggle('visible');
                if(textFallback.classList.contains('visible')) document.getElementById('manual-input').focus();
            } else {
                if(orbState === 'idle' || orbState === 'error') {
                    const u = new SpeechSynthesisUtterance(""); window.speechSynthesis.speak(u);
                    orbState = 'listening'; safeStartMic();
                }
            }
            lastTap = now;
        });
    </script>
</body>
</html>
