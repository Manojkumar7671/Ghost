<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghost OS | Hybrid Terminal</title>
    <style>
        body { background: #0a0a0a; color: #0df; font-family: 'Courier New', monospace; padding: 20px; display: flex; flex-direction: column; height: 90vh; }
        #chat-log { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 15px; margin-bottom: 15px; background: #050505; }
        .msg { margin-bottom: 10px; line-height: 1.4; }
        .user-msg { color: #fff; }
        .ghost-msg { color: #0df; }
        #input-area { display: flex; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid #0df; color: #fff; padding: 12px; font-family: inherit; font-size: 16px; outline: none; }
        input:focus { border-color: #fa0; }
        button { background: #0df; color: #000; border: none; padding: 12px 20px; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        button#mic-btn { background: #444; color: #fff; }
        button#mic-btn.listening { background: #f00; color: white; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <h3>GHOST OS | SECURE TERMINAL LINK</h3>
    <div id="chat-log">
        <div class="msg ghost-msg">System Active. Awaiting text or voice input.</div>
    </div>
    <div id="input-area">
        <button id="mic-btn" onclick="toggleMic()">🎤 MIC</button>
        <input type="text" id="user-input" placeholder="Type a message or click Mic..." onkeypress="if(event.key === 'Enter') sendText()">
        <button onclick="sendText()">SEND</button>
    </div>

    <script>
        const log = document.getElementById('chat-log');
        const input = document.getElementById('user-input');
        const micBtn = document.getElementById('mic-btn');
        
        let recognition;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                micBtn.classList.add('listening');
                micBtn.innerText = '🔴 LISTENING...';
            };
            
            recognition.onend = () => {
                micBtn.classList.remove('listening');
                micBtn.innerText = '🎤 MIC';
            };
            
            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                input.value = transcript;
                sendText(); // Auto-send when voice is captured
            };
            
            recognition.onerror = (e) => {
                console.error("Mic error:", e.error);
                micBtn.classList.remove('listening');
                micBtn.innerText = '🎤 ERROR (Click again)';
            };
        }

        function toggleMic() {
            if (!recognition) return alert("Speech recognition not supported in this browser.");
            
            // Stop any ongoing Ghost speech if you interrupt him
            window.speechSynthesis.cancel();
            
            if (micBtn.classList.contains('listening')) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        async function sendText() {
            const message = input.value.trim();
            if (!message) return;

            appendLog('user-msg', `> You: ${message}`);
            input.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                
                if (data.success) {
                    appendLog('ghost-msg', `Ghost: ${data.text}`);
                    speak(data.text);
                }
            } catch (err) {
                appendLog('ghost-msg', `[SYSTEM ERROR: Connection Failed]`);
            }
        }

        function appendLog(className, text) {
            log.innerHTML += `<div class="msg ${className}">${text}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        function speak(text) {
            // Cancel any ongoing speech so he doesn't talk over himself
            window.speechSynthesis.cancel();
            
            // Clean out the markdown/code artifacts so he doesn't read them aloud awkwardly
            const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/```[\s\S]*?```/g, 'I have output the code to the terminal.');
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
