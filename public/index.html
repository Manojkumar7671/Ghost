<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghost OS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #0df; font-family: 'Courier New', monospace; overflow: hidden; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        #overlay { position: absolute; top: 50px; left: 0; width: 100%; text-align: center; z-index: 10; pointer-events: none; }
        .sys-text { letter-spacing: 5px; font-size: 24px; font-weight: bold; text-transform: uppercase; }
        #subtitle { position: absolute; bottom: 150px; left: 10%; width: 80%; text-align: center; font-size: 1.2em; color: #0df; z-index: 10; }
        
        #input-container { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 10px; }
        input { background: rgba(0,0,0,0.8); border: 1px solid #0df; color: #0df; padding: 10px; width: 300px; }
        button { background: #0df; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="overlay"><div class="sys-text">GHOST OS</div></div>
    <div id="subtitle">Systems Online.</div>
    
    <div id="input-container">
        <input type="text" id="manual-input" placeholder="Execute command..." onkeypress="if(event.key === 'Enter') sendManual()">
        <button onclick="sendManual()">RUN</button>
    </div>

    <script>
        // 3D Engine
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const geometry = new THREE.SphereGeometry(1.5, 64, 64);
        const material = new THREE.PointsMaterial({ color: 0x00ddff, size: 0.02 });
        const sphere = new THREE.Points(geometry, material);
        scene.add(sphere);
        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        async function sendManual() {
            const input = document.getElementById('manual-input');
            if(!input.value.trim()) return;
            document.getElementById('subtitle').innerText = "Processing...";
            
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: input.value, history: [] })
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('subtitle').innerText = data.text;
            }
            input.value = '';
        }
    </script>
</body>
</html>
