<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghost OS | Legacy Text Mode</title>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; }
        #chat-log { height: 70vh; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; }
        #input-area { display: flex; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 10px; }
        button { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h3>GHOST OS | TEXT INTERFACE</h3>
    <div id="chat-log"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Enter command...">
        <button onclick="sendMessage()">SEND</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const log = document.getElementById('chat-log');
            const message = input.value;
            if (!message) return;

            log.innerHTML += `<div>> ${message}</div>`;
            input.value = '';

            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, history: [] })
            });
            const data = await response.json();
            
            if (data.success) {
                log.innerHTML += `<div style="color: #0df;">Ghost: ${data.text}</div>`;
            }
            log.scrollTop = log.scrollHeight;
        }
    </script>
</body>
</html>
