<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost OS // Matrix</title>
    <!-- Pulling in Three.js for the 3D Sphere -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* Base Cyber-Matrix Theme */
        body { background-color: #050505; color: #00ffcc; font-family: monospace; margin: 0; overflow: hidden; display: flex; height: 100vh; }
        
        /* 3D Sphere Container */
        #canvas-container { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at center, #111 0%, #000 100%); } 
        canvas { position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none; }

        /* Sidebar Styling */
        #dataLogSidebar { position: relative; z-index: 10; width: 350px; background: #0a0a0a; border-left: 1px solid #00ffcc; padding: 15px; display: flex; flex-direction: column; }
        #chatContent { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; font-size: 13px; padding-right: 5px; }
        
        .message { padding: 10px; border-radius: 4px; border: 1px solid rgba(0, 255, 204, 0.2); word-wrap: break-word; z-index: 10; }
        .user-style { background: rgba(0, 255, 204, 0.05); color: #fff; border-color: rgba(255, 255, 255, 0.2); }
        .ghost-style { background: rgba(0, 255, 204, 0.1); color: #00ffcc; }
        .error-style { background: rgba(255, 0, 0, 0.1); color: #ff3333; border-color: #ff3333; }
        pre { white-space: pre-wrap; background: #000; padding: 8px; border: 1px solid rgba(0,255,204,0.3); border-radius: 4px; overflow-x: auto; }
        
        /* Input Bar Styling */
        #input-area { position: absolute; bottom: 30px; z-index: 10; display: flex; gap: 10px; background: #111; padding: 12px 20px; border-radius: 30px; border: 1px solid #00ffcc; width: 60%; max-width: 800px; box-shadow: 0 0 15px rgba(0, 255, 204, 0.1); }
        input[type="text"] { flex: 1; background: transparent; border: none; color: #00ffcc; outline: none; font-family: monospace; font-size: 14px; }
        input[type="text"]::placeholder { color: rgba(0, 255, 204, 0.4); }
        button { background: transparent; border: none; color: #00ffcc; cursor: pointer; font-family: monospace; font-size: 16px; transition: 0.2s; }
        button:hover { text-shadow: 0 0 8px #00ffcc; transform: scale(1.1); }
        
        /* Top Status Bar */
        .status-bar { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; gap: 15px; align-items: center; font-weight: bold; }
        .admin-tag { color: #ff3333; text-shadow: 0 0 5px #ff3333; }
        .mode-tag { border: 1px solid #cc00ff; color: #cc00ff; padding: 4px 8px; border-radius: 4px; text-shadow: 0 0 5px #cc00ff; box-shadow: 0 0 5px rgba(204, 0, 255, 0.3); }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 5px; }
    </style>
</head>
<body>

<div id="canvas-container">
    <div class="status-bar">
        <span class="admin-tag">ADMIN // ACTIVE</span>
        <span class="mode-tag">[GHOST CODE: ON]</span>
    </div>
    
    <div id="input-area">
        <button id="attachBtn" title="Upload File or Image">📎</button>
        <button id="voiceBtn" title="Voice Command">🎙️</button>
        <input type="file" id="attachmentInput" style="display: none;" />
        <input type="text" id="userInput" placeholder="Command Ghost... (Double-tap screen to hide)" autocomplete="off" />
        <button id="sendBtn">ENTER</button>
    </div>
</div>

<div id="dataLogSidebar">
    <!-- Header stays permanently -->
    <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #00ffcc; padding-bottom: 10px; margin-bottom: 10px; font-weight: bold; font-size: 14px;">
        <span>GHOST // DATA LOG</span>
        <span style="cursor:pointer; color: #ff3333;" onclick="clearChat()">X</span>
    </div>
    
    <!-- Chat messages load here -->
    <div id="chatContent">
        <div class="message ghost-style">
            <strong>Ghost:</strong><br> Online. Awaiting your command, Master Manoj.
        </div>
    </div>
</div>

<script>
    // --- 3D RED SPHERE MATRIX GENERATOR ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    
    const container = document.getElementById('canvas-container');
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const geometry = new THREE.BufferGeometry();
    const particlesCount = 2500;
    const posArray = new Float32Array(particlesCount * 3);

    // Creates the structured spherical dot pattern
    for(let i = 0; i < particlesCount; i++) {
        const phi = Math.acos(-1 + (2 * i) / particlesCount);
        const theta = Math.sqrt(particlesCount * Math.PI) * phi;
        const r = 4;
        
        posArray[i * 3] = r * Math.cos(theta) * Math.sin(phi);     // x
        posArray[i * 3 + 1] = r * Math.sin(theta) * Math.sin(phi); // y
        posArray[i * 3 + 2] = r * Math.cos(phi);                   // z
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const material = new THREE.PointsMaterial({ size: 0.03, color: 0xff0033 }); // Crimson Red
    const particlesMesh = new THREE.Points(geometry, material);
    scene.add(particlesMesh);
    camera.position.z = 9;

    function animate() {
        requestAnimationFrame(animate);
        particlesMesh.rotation.y += 0.0015; // Slow spin
        particlesMesh.rotation.x += 0.0005;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // --- GLOBAL BUFFERS ---
    let uploadedFileText = "";
    let uploadedImageBase64 = "";

    // --- DOM ELEMENTS ---
    const attachmentInput = document.getElementById('attachmentInput');
    const attachBtn = document.getElementById('attachBtn');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatContent = document.getElementById('chatContent');

    // --- CLEAR CHAT FUNCTION ---
    function clearChat() {
        chatContent.innerHTML = '';
        appendMessageToUI("System", "Data log cleared.", "ghost-style");
    }

    // --- ATTACHMENT LISTENER ---
    attachBtn.addEventListener('click', () => attachmentInput.click());

    if (attachmentInput) {
        attachmentInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            if (file.type.startsWith('image/')) {
                reader.onload = (event) => {
                    uploadedImageBase64 = event.target.result.split(',')[1]; 
                    appendMessageToUI("System", `Optical data loaded: ${file.name}`, "ghost-style");
                };
                reader.readAsDataURL(file);
            } else {
                reader.onload = (event) => {
                    uploadedFileText = event.target.result;
                    appendMessageToUI("System", `Document text loaded: ${file.name}`, "ghost-style");
                };
                reader.readAsText(file);
            }
        });
    }

    // --- SEND LOGIC ---
    sendBtn.addEventListener('click', triggerSend);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') triggerSend();
    });

    function triggerSend() {
        const text = userInput.value.trim();
        if (!text && !uploadedImageBase64 && !uploadedFileText) return; 
        sendToGhost(text);
        userInput.value = "";
    }

    // --- CORE COMMUNICATION PIPELINE ---
    async function sendToGhost(userMessage) {
        appendMessageToUI("Master Manoj", userMessage || "[File Uploaded]", "user-style");

        const payload = {
            message: userMessage,
            user: 'Master Manoj', 
            ghostCodeMode: true, 
            image: uploadedImageBase64 || null,
            fileContent: uploadedFileText || null
        };

        uploadedFileText = "";
        uploadedImageBase64 = "";
        if (attachmentInput) attachmentInput.value = ""; 

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            
            if (data.success) {
                let ghostReply = data.text;

                if (ghostReply.includes("[EXECUTE_OPEN_TAB:")) {
                    const urlMatch = ghostReply.match(/\[EXECUTE_OPEN_TAB:(.*?)\]/);
                    if (urlMatch && urlMatch[1]) {
                        window.open(urlMatch[1].trim(), '_blank'); 
                        ghostReply = ghostReply.replace(urlMatch[0], '').trim(); 
                    }
                }

                appendMessageToUI("Ghost", ghostReply, "ghost-style");

            } else {
                appendMessageToUI("System", "Matrix fault: Backend rejected payload.", "error-style");
            }

        } catch (error) {
            appendMessageToUI("System", "Matrix offline: Connection severed.", "error-style");
        }
    }

    // --- UI FORMATTING HELPER ---
    function appendMessageToUI(sender, text, cssClass) {
        if (!chatContent) return;

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${cssClass}`;
        
        let formattedText = text.replace(/```python([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
        formattedText = formattedText.replace(/```([\s\S]*?)
```/g, '<pre><code>$1</code></pre>');
        formattedText = formattedText.replace(/\n/g, '<br>');
        
        msgDiv.innerHTML = `<strong>${sender}:</strong><br> ${formattedText}`;
        chatContent.appendChild(msgDiv);
        
        chatContent.scrollTop = chatContent.scrollHeight;
    }
</script>
</body>
</html>
