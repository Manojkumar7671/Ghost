<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost OS | Cloud Terminal</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #00ffcc;
            --text-dim: #0088aa;
            --alert: #ff0055;
            --sidebar-bg: #0a0a0a;
            --border: #1a1a1a;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; display: flex;
        }
        /* Layout Grid */
        #os-wrapper {
            display: flex; width: 100%; height: 100%;
        }
        /* Main Terminal Area */
        #main-terminal {
            flex-grow: 1; display: flex; flex-direction: column;
            padding: 20px; transition: width 0.3s ease;
        }
        #output-log {
            flex-grow: 1; overflow-y: auto; padding-bottom: 20px;
            scroll-behavior: smooth;
        }
        .log-entry { margin-bottom: 15px; line-height: 1.4; }
        .log-user { color: #ffffff; }
        .log-ghost { color: var(--text-main); }
        .log-system { color: var(--text-dim); font-size: 0.9em; }
        
        /* Hybrid Input Area */
        #input-area {
            display: flex; align-items: center; border-top: 1px solid var(--border);
            padding-top: 15px;
        }
        #prompt-symbol { margin-right: 10px; color: var(--text-dim); font-weight: bold; }
        #text-input {
            flex-grow: 1; background: transparent; border: none;
            color: #ffffff; font-family: 'Courier New', Courier, monospace;
            font-size: 16px; outline: none;
        }
        #mic-btn {
            background: transparent; border: 1px solid var(--text-dim);
            color: var(--text-dim); padding: 5px 15px; margin-left: 10px;
            cursor: pointer; border-radius: 3px; transition: all 0.2s;
        }
        #mic-btn.listening { background: var(--text-dim); color: #000; box-shadow: 0 0 10px var(--text-dim); }
        #mic-btn.speaking { background: var(--alert); color: #fff; border-color: var(--alert); }

        /* Dynamic Sidebar */
        #sidebar {
            width: 0; background-color: var(--sidebar-bg); border-left: 1px solid var(--border);
            overflow-x: hidden; transition: 0.3s; display: flex; flex-direction: column;
        }
        #sidebar.open { width: 400px; padding: 20px; }
        .sidebar-header { border-bottom: 1px solid var(--text-dim); padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; }
        #sidebar-content pre { white-space: pre-wrap; font-size: 0.85em; color: #aaa; }
    </style>
</head>
<body>

<div id="os-wrapper">
    <div id="main-terminal">
        <div id="output-log">
            <div class="log-entry log-system">Ghost OS Matrix Online. Audio subsystems standby. Awaiting input, Sir.</div>
        </div>
        <div id="input-area">
            <span id="prompt-symbol">GHOST_OS></span>
            <input type="text" id="text-input" placeholder="Type a command or activate audio..." autocomplete="off" autofocus>
            <button id="mic-btn">AUDIO: OFF</button>
        </div>
    </div>
    
    <div id="sidebar" class="hidden">
        <div class="sidebar-header">SYSTEM OVERRIDE & CODE MATRIX</div>
        <div id="sidebar-content">
            <div class="log-system">No active background processes.</div>
        </div>
    </div>
</div>

<script>
    let conversationHistory = [];
    let audioCtx;
    const outputLog = document.getElementById('output-log');
    const textInput = document.getElementById('text-input');
    const micBtn = document.getElementById('mic-btn');
    const sidebar = document.getElementById('sidebar');
    const sidebarContent = document.getElementById('sidebar-content');

    // UI Helper: Append to Terminal
    function appendLog(sender, text) {
        const div = document.createElement('div');
        div.className = `log-entry log-${sender}`;
        div.innerHTML = `<strong>${sender.toUpperCase()}:</strong> ${text}`;
        outputLog.appendChild(div);
        outputLog.scrollTop = outputLog.scrollHeight;
    }

    // UI Helper: Trigger Sidebar Logic
    function evaluateSidebar(text, isSwarm, swarmData) {
        const triggers = ['code', 'script', 'function', 'swarm', 'terminal', 'debug'];
        const textLower = text.toLowerCase();
        
        if (isSwarm || triggers.some(t => textLower.includes(t))) {
            sidebar.classList.add('open');
            if (isSwarm && swarmData) {
                sidebarContent.innerHTML = `<pre>${JSON.stringify(swarmData, null, 2)}</pre>`;
            } else {
                sidebarContent.innerHTML = `<div class="log-system">Monitoring technical payload...</div><pre>${text}</pre>`;
            }
        } else {
            sidebar.classList.remove('open');
        }
    }

    // Backend Communication
    async function sendToGhost(message) {
        appendLog('user', message);
        textInput.value = '';
        
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message, history: conversationHistory })
            });
            const data = await response.json();
            
            if (data.success) {
                conversationHistory.push({ role: 'user', parts: [{ text: message }] });
                conversationHistory.push({ role: 'model', parts: [{ text: data.text }] });
                
                evaluateSidebar(data.text, data.isSwarm, data.swarm);
                
                if (data.isSwarm) {
                    appendLog('system', 'Swarm Engine Engaged. See sidebar for details.');
                    speak("Swarm protocols initialized, Sir. Processing parallel agent nodes.");
                } else {
                    appendLog('ghost', data.text);
                    speak(data.text);
                }
            }
        } catch (err) {
            appendLog('system', 'CRITICAL ERROR: Connection to core severed.');
        }
    }

    // Text Input Handling
    textInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && textInput.value.trim() !== '') {
            sendToGhost(textInput.value.trim());
        }
    });

    // --- AUDIO SUBSYSTEM ---
    function lockAudioEngine() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
        }
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        let cleanText = text.replace(/<open:.*?>|<search:.*?>/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        
        // Find British Voice
        const voices = window.speechSynthesis.getVoices();
        const britishVoice = voices.find(v => v.lang.includes('en-GB')) || voices[0];
        if (britishVoice) utterance.voice = britishVoice;
        
        utterance.onstart = () => { micBtn.className = 'speaking'; micBtn.innerText = 'AUDIO: SPEAKING'; if(window.ghostRec) window.ghostRec.abort(); };
        utterance.onend = () => { micBtn.className = 'listening'; micBtn.innerText = 'AUDIO: LISTENING'; executeEmbeddedTags(text); restartMicLoop(); };
        window.speechSynthesis.speak(utterance);
    }

    function executeEmbeddedTags(rawText) {
        const openMatch = rawText.match(/<open:\s*(https?:\/\/[^\s>]+)>/);
        const searchMatch = rawText.match(/<search:\s*([^>]+)>/);
        if (openMatch) window.open(openMatch[1], '_blank');
        else if (searchMatch) window.open('https://www.google.com/search?q=' + encodeURIComponent(searchMatch[1].trim()), '_blank');
    }

    function initVoiceSystem() {
        lockAudioEngine();
        micBtn.className = 'listening';
        micBtn.innerText = 'AUDIO: LISTENING';
        
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            window.ghostRec = new SpeechRec();
            window.ghostRec.continuous = false;
            window.ghostRec.interimResults = false;
            window.ghostRec.lang = 'en-US';
            
            window.ghostRec.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                micBtn.className = '';
                micBtn.innerText = 'AUDIO: PROCESSING';
                sendToGhost(transcript);
            };
            
            window.ghostRec.onend = () => setTimeout(() => restartMicLoop(), 100);
            try { window.ghostRec.start(); } catch(e) {}
        } else {
            appendLog('system', 'Voice API not supported in this browser environment.');
        }
    }

    function restartMicLoop() {
        if (window.speechSynthesis.speaking || micBtn.className === '') return;
        try { window.ghostRec.start(); } catch(e) {}
    }

    // Start Audio on Mic Button Click
    micBtn.addEventListener('click', initVoiceSystem, { once: true });
    window.speechSynthesis.onvoiceschanged = window.speechSynthesis.getVoices;
</script>
</body>
</html>
