<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghost OS | Developer Console</title>
    <style>
        body { background: #050505; color: #0df; font-family: 'Courier New', monospace; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        #main { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        #chat-log { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 15px; background: #000; font-size: 15px; line-height: 1.6; }
        .msg { margin-bottom: 15px; }
        .user-msg { color: #fff; }
        .ghost-msg { color: #0df; }
        #input-area { display: flex; margin-top: 10px; gap: 10px; }
        input { flex: 1; background: #111; border: 1px solid #0df; color: #fff; padding: 15px; font-family: inherit; font-size: 16px; outline: none; }
        button { background: #0df; color: #000; border: none; padding: 15px 30px; cursor: pointer; font-weight: bold; font-family: inherit; }
        
        /* The Skills Sidebar */
        #sidebar { width: 0; background: #111; border-left: 1px solid #0df; transition: 0.3s; overflow-y: auto; }
        #sidebar.open { width: 450px; padding: 20px; }
        pre { color: #aaa; white-space: pre-wrap; font-size: 13px; font-family: inherit; }
    </style>
</head>
<body>
    <div id="main">
        <h3>GHOST OS | DEVELOPER TEST CONSOLE (TEXT ONLY)</h3>
        <div id="chat-log"><div class="msg ghost-msg">Ghost: Voice disabled. Text-only secure link established. Awaiting commands.</div></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type command to test skills..." onkeypress="if(event.key === 'Enter') sendText()">
            <button onclick="sendText()">EXECUTE</button>
        </div>
    </div>
    <div id="sidebar">
        <h4 style="margin-top:0;">MATRIX / CODE PAYLOAD</h4>
        <div id="sidebar-content"></div>
    </div>

    <script>
        const log = document.getElementById('chat-log');
        const input = document.getElementById('user-input');
        const sidebar = document.getElementById('sidebar');
        const sidebarContent = document.getElementById('sidebar-content');
        let history = [];

        async function sendText() {
            const text = input.value.trim();
            if (!text) return;
            
            log.innerHTML += `<div class="msg user-msg">> You: ${text}</div>`;
            input.value = '';
            log.scrollTop = log.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: text, history: history })
                });
                const data = await res.json();
                
                if(data.success) {
                    history.push({ role: 'user', parts: [{ text: text }] });
                    history.push({ role: 'model', parts: [{ text: data.text }] });
                    
                    log.innerHTML += `<div class="msg ghost-msg">Ghost: ${data.text}</div>`;
                    log.scrollTop = log.scrollHeight;

                    // Trigger Sidebar Skill for Code/Swarm
                    const triggers = ['code', 'script', 'function', 'swarm', 'python'];
                    if (data.isSwarm || triggers.some(t => data.text.toLowerCase().includes(t))) {
                        sidebar.classList.add('open');
                        sidebarContent.innerHTML = `<pre>${data.isSwarm ? JSON.stringify(data.swarm, null, 2) : data.text}</pre>`;
                    } else {
                        sidebar.classList.remove('open');
                    }
                }
            } catch(e) {
                log.innerHTML += `<div class="msg ghost-msg" style="color:red;">[ERROR: CONNECTION FAILED]</div>`;
            }
        }
    </script>
</body>
</html>
