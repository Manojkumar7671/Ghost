<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost OS</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000000 !important; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', Courier, monospace; }
        
        #ghost-orb { 
            width: 100px; height: 100px; 
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(0,0,0,0) 70%); 
            border-radius: 50%; 
            box-shadow: 0 0 30px rgba(255,255,255,0.2); 
            transition: all 0.2s ease; cursor: pointer; 
        }
        
        /* The Default State: Always Listening */
        #ghost-orb.listening { 
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.7); 
            animation: breathe 3s infinite ease-in-out; 
        }
        
        /* The Thinking State: Waiting for API */
        #ghost-orb.processing { 
            box-shadow: 0 0 50px rgba(255, 165, 0, 0.8); 
            transform: scale(0.9);
        }

        /* The Speaking State: Ghost is Talking */
        #ghost-orb.speaking { 
            box-shadow: 0 0 60px rgba(255, 0, 255, 0.8); 
            transform: scale(1.15); 
            animation: pulse-fast 0.5s infinite alternate;
        }

        @keyframes breathe { 
            0% { transform: scale(1); opacity: 0.7; } 
            50% { transform: scale(1.05); opacity: 1; } 
            100% { transform: scale(1); opacity: 0.7; } 
        }
        @keyframes pulse-fast {
            0% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }
        
        #status-text {
            position: absolute; bottom: 30px; color: #333; font-size: 12px; letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="ghost-orb"></div>
<div id="status-text">CLICK ORB TO INITIALIZE PROTOCOLS</div>

<script>
    let conversationHistory = [];
    const orb = document.getElementById('ghost-orb');
    const statusText = document.getElementById('status-text');
    let audioCtx;
    let isProcessing = false;

    // 1. Audio Engine Unlock
    function lockAudioEngine() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
        }
    }

    // 2. Ghost's Voice Generation
    function speak(text) {
        window.speechSynthesis.cancel(); // Clear any ongoing speech
        let cleanText = text.replace(/<open:.*?>|<search:.*?>/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        
        const voices = window.speechSynthesis.getVoices();
        const britishVoice = voices.find(v => v.lang.includes('en-GB')) || voices[0];
        if (britishVoice) utterance.voice = britishVoice;
        
        utterance.onstart = () => { 
            orb.className = 'speaking'; 
            statusText.innerText = 'GHOST IS SPEAKING';
        };
        
        utterance.onend = () => { 
            isProcessing = false;
            orb.className = 'listening'; 
            statusText.innerText = 'SYSTEM ACTIVE: LISTENING';
            executeEmbeddedTags(text); 
            restartMicLoop(); 
        };
        
        window.speechSynthesis.speak(utterance);
    }

    // 3. Execution Hooks
    function executeEmbeddedTags(rawText) {
        const openMatch = rawText.match(/<open:\s*(https?:\/\/[^\s>]+)>/);
        const searchMatch = rawText.match(/<search:\s*([^>]+)>/);
        if (openMatch) window.open(openMatch[1], '_blank');
        else if (searchMatch) window.open('https://www.google.com/search?q=' + encodeURIComponent(searchMatch[1].trim()), '_blank');
    }

    // 4. Always-On Microphone Protocol
    function initGhostVoiceSystem() {
        lockAudioEngine();
        orb.className = 'listening';
        statusText.innerText = 'SYSTEM ACTIVE: LISTENING';
        
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            window.ghostRec = new SpeechRec();
            
            // Critical settings for always-on and barge-in
            window.ghostRec.continuous = true; 
            window.ghostRec.interimResults = true; 
            window.ghostRec.lang = 'en-US';
            
            window.ghostRec.onresult = async (event) => {
                // BARGE-IN: If Ghost is talking, tell him to shut up immediately
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                    orb.className = 'listening';
                }

                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }

                // If we have a completed sentence and aren't already processing one
                if (finalTranscript.trim() !== '' && !isProcessing) {
                    isProcessing = true;
                    orb.className = 'processing';
                    statusText.innerText = 'PROCESSING DATA...';
                    
                    try {
                        const response = await fetch('/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: finalTranscript, history: conversationHistory })
                        });
                        const data = await response.json();
                        
                        if (data.success) {
                            conversationHistory.push({ role: 'user', parts: [{ text: finalTranscript }] });
                            conversationHistory.push({ role: 'model', parts: [{ text: data.text }] });
                            speak(data.text);
                        }
                    } catch (err) { 
                        isProcessing = false;
                        restartMicLoop(); 
                    }
                }
            };
            
            // Auto-restart if the browser tries to put the mic to sleep
            window.ghostRec.onend = () => {
                if (!window.speechSynthesis.speaking) {
                    setTimeout(() => restartMicLoop(), 200);
                }
            };
            
            try { window.ghostRec.start(); } catch(e) {}
        }
    }

    function restartMicLoop() {
        if (window.speechSynthesis.speaking) return; // Don't listen to himself
        try { window.ghostRec.start(); } catch(e) {}
        orb.className = 'listening';
        statusText.innerText = 'SYSTEM ACTIVE: LISTENING';
    }

    // Single click to start the permanent loop
    document.addEventListener('click', initGhostVoiceSystem, { once: true });
    window.speechSynthesis.onvoiceschanged = window.speechSynthesis.getVoices;
</script>
</body>
</html>
