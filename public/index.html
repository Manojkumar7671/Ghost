<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghost OS v14</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #0df; font-family: 'Courier New', monospace; overflow: hidden; user-select: none; }
        #overlay { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; pointer-events: none; width: 90%; }
        .sys-text { letter-spacing: 5px; font-size: 24px; font-weight: bold; text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 221, 255, 0.6); color: #0df; transition: color 0.3s; word-wrap: break-word; }
        #sidebar { position: absolute; right: -450px; top: 0; width: 400px; height: 100%; background: rgba(0, 0, 0, 0.95); border-left: 1px solid #0df; transition: right 0.4s cubic-bezier(0.1, 0.8, 0.1, 1); z-index: 20; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        #sidebar.open { right: 0; }
        .sidebar-header { border-bottom: 1px solid rgba(0,221,255,0.4); padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; letter-spacing: 2px; }
        #sidebar-content pre { white-space: pre-wrap; font-size: 0.85em; color: #aaa; font-family: inherit; }
        #text-fallback { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; display: flex; gap: 10px; }
        #text-fallback.visible { opacity: 1; pointer-events: auto; }
        #text-fallback input { background: rgba(0,0,0,0.8); border: 1px solid #0df; color: #0df; padding: 12px; width: 350px; font-family: inherit; outline: none; box-shadow: 0 0 10px rgba(0,221,255,0.2); }
        #text-fallback button { background: #0df; color: #000; border: none; padding: 12px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="sys-text" id="status">GHOST V14</div>
    </div>
    <div id="sidebar"><div class="sidebar-header">MATRIX PAYLOAD</div><div id="sidebar-content"></div></div>
    <div id="text-fallback"><input type="text" id="manual-input" placeholder="Execute command..." onkeypress="if(event.key === 'Enter') sendManual()"><button onclick="sendManual()">RUN</button></div>

    <script>
        setInterval(() => { fetch('/ping').catch(() => {}); }, 150000); 

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const particlesCount = 4000;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i+=3) {
            const r = 2.3, theta = 2 * Math.PI * Math.random(), phi = Math.acos(2 * Math.random() - 1);
            posArray[i] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = r * Math.cos(phi);
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const material = new THREE.PointsMaterial({ size: 0.02, color: 0x00ddff, transparent: true, opacity: 0.8 });
        const particlesMesh = new THREE.Points(geometry, material);
        scene.add(particlesMesh);
        camera.position.z = 5.5;

        let orbState = 'idle'; 
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.002;
            particlesMesh.rotation.x += 0.001;
            if (orbState === 'processing') { material.color.setHex(0xffaa00); particlesMesh.rotation.y += 0.04; } 
            else if (orbState === 'speaking') { material.color.setHex(0x00ddff); const p = 1 + Math.sin(clock.getElapsedTime() * 10) * 0.12; particlesMesh.scale.set(p, p, p); } 
            else if (orbState === 'error') { material.color.setHex(0xff0000); particlesMesh.scale.set(1, 1, 1); } 
            else { material.color.setHex(0x00ddff); particlesMesh.scale.set(1, 1, 1); }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

        const statusEl = document.getElementById('status');
        const textFallback = document.getElementById('text-fallback');
        const sidebar = document.getElementById('sidebar');
        const sidebarContent = document.getElementById('sidebar-content');
        let isRecognizing = false;
        let currentAudio = null;
        let conversationHistory = []; 

        function evaluateSidebar(text) {
            if (['code', 'script', 'function', 'python', '```', 'json'].some(t => text.toLowerCase().includes(t))) {
                sidebar.classList.add('open');
                sidebarContent.innerHTML = `<pre>${text}</pre>`;
            } else {
                sidebar.classList.remove('open');
            }
        }

        async function playVoice(text, audioB64) {
            orbState = 'speaking';
            if (!statusEl.innerText.includes('ERR')) {
                statusEl.innerText = 'GHOST V14';
                statusEl.style.color = '#0df';
            }
            
            if (audioB64 && audioB64.length > 0) {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') await ctx.resume();
                currentAudio = new Audio("data:audio/mp3;base64," + audioB64[0]);
                currentAudio.onended = () => { orbState = 'listening'; safeStartMic(); };
                currentAudio.play().catch(() => playNativeVoice(text));
            } else {
                playNativeVoice(text);
            }
        }

        function playNativeVoice(text) {
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/```[\s\S]*?```/g, 'I have sent the data to your console.');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            
            const voices = window.speechSynthesis.getVoices();
            const ukFemale = voices.find(v => v.lang.includes('en-GB') && (v.name.includes('Serena') || v.name.includes('Martha') || v.name.includes('Female')));
            if(ukFemale) utterance.voice = ukFemale;

            utterance.onend = () => { orbState = 'listening'; safeStartMic(); };
            window.speechSynthesis.speak(utterance);
        }

        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        let rec = null;
        if (SpeechRec) {
            rec = new SpeechRec();
            rec.continuous = false;
            rec.onstart = () => { isRecognizing = true; orbState = 'listening'; statusEl.innerText = 'GHOST V14'; statusEl.style.color = '#0df'; };
            rec.onend = () => { isRecognizing = false; if(orbState === 'listening') safeStartMic(); };
            rec.onerror = (e) => { 
                isRecognizing = false; 
                if(e.error !== 'no-speech') {
                    statusEl.innerText = `[MIC BLOCK: BROWSER NOT SUPPORTED]`;
                    statusEl.style.color = '#f00';
                    orbState = 'error';
                }
            };
            rec.onresult = async (e) => processInput(e.results[0][0].transcript);
        }

        async function processInput(text) {
            if(!text.trim()) return;
            orbState = 'processing';
            statusEl.innerText = 'GHOST [THINKING]';
            window.speechSynthesis.cancel();
            if(currentAudio) currentAudio.pause();
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);

                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: text, history: conversationHistory }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const data = await res.json();
                
                if (data.success) {
                    conversationHistory.push({ role: 'user', content: text });
                    conversationHistory.push({ role: 'assistant', content: data.text });
                    evaluateSidebar(data.text);
                    
                    if (data.audio_b64.length === 0 && data.voice_diagnostic) {
                        statusEl.innerText = `[11LABS ERR: CHECK CREDITS]`;
                        statusEl.style.color = '#fa0';
                    }
                    
                    playVoice(data.text, data.audio_b64);
                } else {
                    statusEl.innerText = `[API ERROR]: ${data.text.toUpperCase()}`;
                    statusEl.style.color = '#f00';
                    orbState = 'error';
                    setTimeout(() => { orbState = 'listening'; statusEl.innerText = 'GHOST V14'; statusEl.style.color = '#0df'; safeStartMic(); }, 6000);
                }
            } catch(err) {
                statusEl.innerText = `[SERVER WAKING UP - RETRY]`;
                statusEl.style.color = '#fa0';
                orbState = 'error';
                setTimeout(() => { orbState = 'listening'; statusEl.innerText = 'GHOST V14'; statusEl.style.color = '#0df'; safeStartMic(); }, 4000);
            }
        }

        function sendManual() {
            const input = document.getElementById('manual-input');
            if(!input.value.trim()) return;
            processInput(input.value);
            input.value = '';
            document.getElementById('text-fallback').classList.remove('visible');
        }

        function safeStartMic() {
            if (rec && !isRecognizing && orbState !== 'speaking' && orbState !== 'processing' && orbState !== 'error') {
                try { rec.start(); } catch(e) {}
            }
        }

        setInterval(() => {
            if (orbState === 'listening' && !isRecognizing) safeStartMic();
        }, 1000);

        let lastTap = 0;
        document.body.addEventListener('click', (e) => {
            if(e.target.closest('#text-fallback') || e.target.closest('#sidebar')) return;
            const now = new Date().getTime();
            if (now - lastTap < 300) {
                textFallback.classList.toggle('visible');
                if(textFallback.classList.contains('visible')) document.getElementById('manual-input').focus();
            } else {
                if(orbState === 'idle' || orbState === 'error') {
                    const u = new SpeechSynthesisUtterance(""); window.speechSynthesis.speak(u);
                    orbState = 'listening'; safeStartMic();
                }
            }
            lastTap = now;
        });
    </script>
</body>
</html>
