<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost OS // Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body { 
            margin: 0; 
            background-color: #050505; 
            color: #00ffcc; 
            font-family: 'JetBrains Mono', monospace; 
            overflow: hidden; 
            user-select: none;
        }
        input:focus, button:focus { outline: none; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 3px; }

        /* Glowing Ghost Code Button */
        #ghost-code-btn {
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2), inset 0 0 5px rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        #ghost-code-btn.active {
            color: #cc00ff;
            border-color: #cc00ff;
            box-shadow: 0 0 15px rgba(204, 0, 255, 0.4), inset 0 0 10px rgba(204, 0, 255, 0.2);
            background: rgba(204, 0, 255, 0.1);
        }

        /* Sidebar Matrix */
        #sidebar {
            position: fixed;
            top: 0;
            right: -450px;
            width: 400px;
            height: 100%;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(0, 255, 204, 0.2);
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
        }
        #sidebar.open { right: 0; }
        #sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            letter-spacing: 1px;
        }
        #close-sidebar {
            background: transparent;
            border: none;
            color: #00ffcc;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        #close-sidebar:hover { color: #ff0032; }
        #chat-history {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
        }
        .msg-user { color: #fff; margin-bottom: 15px; text-align: right; opacity: 0.8;}
        .msg-ghost { color: #00ffcc; margin-bottom: 25px; border-left: 2px solid #00ffcc; padding-left: 10px;}
        pre { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 4px; overflow-x: auto; border: 1px solid rgba(0,255,204,0.1); color: #fff;}

        /* Live Subtitles */
        #subtitle-overlay {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            text-align: center;
            pointer-events: none;
            z-index: 999;
            font-size: 16px;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
            min-height: 24px;
        }
    </style>
</head>
<body>
    
    <div id="top-bar" style="position: absolute; top: 0; left: 0; width: 100%; padding: 20px; display: flex; align-items: center; box-sizing: border-box; z-index: 1000;">
        <div id="status-indicator" style="font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 5px currentColor;">GHOST // STANDBY</div>
        
        <button id="ghost-code-btn" style="display: none; margin-left: 30px;">[GHOST CODE: OFF]</button>
        
        <div style="margin-left: auto; display: flex; gap: 15px;">
            <button id="toggle-sidebar-btn" style="display: none; border: 1px solid rgba(0,255,204,0.4); color: #00ffcc; background: transparent; padding: 6px 12px; cursor: pointer; border-radius: 4px;">DATA LOG</button>
            <button id="disconnect-btn" style="display: none; border: 1px solid rgba(255,0,50,0.5); color: #ff0032; background: rgba(255,0,50,0.05); padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; font-family: monospace;">DISCONNECT</button>
        </div>
    </div>

    <div id="auth-layer" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1001; text-align: center;">
        <div style="margin-bottom: 20px; font-size: 24px; letter-spacing: 4px; text-shadow: 0 0 10px #00ffcc;">IDENTIFICATION REQUIRED</div>
        <input type="text" id="authInput" placeholder="Enter your name..." style="background: rgba(0,0,0,0.6); border: 1px solid rgba(0,255,204,0.3); color: #00ffcc; padding: 12px 20px; font-family: 'JetBrains Mono', monospace; text-align: center; border-radius: 4px; width: 280px; transition: all 0.3s; font-size: 16px;">
        <div style="margin-top: 15px; font-size: 12px; color: rgba(0,255,204,0.6); letter-spacing: 1px;">Press [ENTER] to initialize</div>
    </div>

    <div id="subtitle-overlay"></div>

    <div id="hud-container" style="display: none;">
        <button id="floating-mic-btn" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 50%; background: rgba(0,255,204,0.1); border: 1px solid #00ffcc; color: #00ffcc; font-size: 24px; cursor: pointer; z-index: 1000; box-shadow: 0 0 15px rgba(0,255,204,0.2); transition: 0.3s; display: none; align-items: center; justify-content: center;">🎙️</button>

        <div id="input-area" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 15px; z-index: 1000; width: 70%; max-width: 800px; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(0,255,204,0.2); backdrop-filter: blur(5px);">
            <input type="file" id="image-upload" style="display: none;">
            <button id="attach-btn" style="background: transparent; border: none; color: #00ffcc; font-size: 18px; cursor: pointer; transition: 0.3s;">📎</button>
            <button id="mic-btn" style="background: transparent; border: none; color: #00ffcc; font-size: 18px; cursor: pointer; transition: 0.3s;">🎙️</button>
            <input type="text" id="chatInput" placeholder="Command Ghost... (Double-tap screen to hide)" style="width: 100%; background: transparent; border: none; color: #00ffcc; padding: 10px; font-family: 'JetBrains Mono', monospace; font-size: 15px;">
        </div>
    </div>

    <div id="sidebar">
        <div id="sidebar-header">
            <span id="sidebar-title">GHOST // DATA LOG</span>
            <button id="close-sidebar">✕</button>
        </div>
        <div id="chat-history"></div>
    </div>

    <canvas id="bg-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></canvas>

    <script src="ghost-ui.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Create glowing circular particles
        const circleCanvas = document.createElement('canvas');
        circleCanvas.width = 32;
        circleCanvas.height = 32;
        const ctx = circleCanvas.getContext('2d');
        ctx.beginPath();
        ctx.arc(16, 16, 14, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        const circleTexture = new THREE.CanvasTexture(circleCanvas);

        // Calculate surface points for a perfect sphere
        const particleCount = 2000;
        const radius = 15;
        const positions = new Float32Array(particleCount * 3);
        const phases = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const phi = Math.acos(-1 + (2 * i) / particleCount);
            const theta = Math.sqrt(particleCount * Math.PI) * phi;
            
            positions[i * 3] = radius * Math.cos(theta) * Math.sin(phi);
            positions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
            positions[i * 3 + 2] = radius * Math.cos(phi);
            
            phases[i] = Math.random() * Math.PI * 2;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('phase', new THREE.BufferAttribute(phases, 1));

        const material = new THREE.PointsMaterial({
            color: 0x00ffcc, 
            size: 0.25,
            map: circleTexture,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSphere = new THREE.Points(geometry, material);
        scene.add(particleSphere);
        camera.position.z = 35;

        // Color Sync
        const observer = new MutationObserver(() => {
            const statusColor = document.getElementById('status-indicator').style.color;
            if (statusColor === 'rgb(255, 0, 50)' || statusColor === '#ff0032') {
                material.color.setHex(0xff0032); 
            } else {
                material.color.setHex(0x00ffcc); 
            }
        });
        observer.observe(document.getElementById('status-indicator'), { attributes: true, attributeFilter: ['style'] });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            particleSphere.rotation.y = time * 0.05;
            particleSphere.rotation.x = time * 0.02;

            const posAttr = geometry.attributes.position;
            const phaseAttr = geometry.attributes.phase;
            
            // Subtle breathing effect
            const scale = 1 + Math.sin(time * 2) * 0.02;
            particleSphere.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
