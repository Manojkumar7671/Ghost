<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRIDAY - Online</title>
<style>
  body { background-color: #050505; color: #00e5ff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
  #chat-log { width: 90%; max-width: 800px; height: 65vh; overflow-y: auto; margin-bottom: 30px; padding: 10px; display: flex; flex-direction: column; gap: 15px; }
  .msg { background: rgba(0, 229, 255, 0.05); padding: 15px; border-radius: 8px; border-left: 3px solid #00e5ff; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { border-left: none; border-right: 3px solid #00ffaa; background: rgba(0, 255, 170, 0.05); text-align: right; align-self: flex-end; }
  #orb { width: 80px; height: 80px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 20px #00e5ff; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; text-align: center; font-size: 14px; letter-spacing: 1px; user-select: none; }
  #orb:hover { transform: scale(1.05); box-shadow: 0 0 30px #00e5ff; }
  #orb.recording { background: #ff0055; box-shadow: 0 0 30px #ff0055; transform: scale(1.1); }
  #orb.busy { background: #ffaa00; box-shadow: 0 0 20px #ffaa00; animation: pulse 1s infinite alternate; cursor: not-allowed; }
  img.vision-result { max-width: 100%; border-radius: 4px; margin-top: 15px; border: 1px solid #333; display: block; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
  .status-text { font-size: 10px; opacity: 0.5; margin-top: 15px; letter-spacing: 3px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="status-text" style="margin-bottom: 20px;">FRIDAY — ONLINE</div>
  <div id="chat-log"></div>
  <div id="orb" onclick="toggleRecording()">TAP</div>
  <div class="status-text" id="status">STANDBY</div>

  <script>
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let isBusy = false;
    let currentAudio = null;

    const orb = document.getElementById('orb');
    const statusEl = document.getElementById('status');
    const chatLog = document.getElementById('chat-log');

    function addMessage(text, isUser = false, imageB64 = null) {
      const div = document.createElement('div');
      div.className = 'msg ' + (isUser ? 'user' : 'ai');
      div.innerText = text;
      
      // Inject cloud browser screenshots if they exist
      if (imageB64) {
        const img = document.createElement('img');
        img.src = 'data:image/png;base64,' + imageB64;
        img.className = 'vision-result';
        div.appendChild(img);
      }
      
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function playAudio(audioData) {
      if (!audioData) {
        // Fallback to browser speech if cloud fails
        const lastMsg = chatLog.lastChild.innerText;
        const u = new SpeechSynthesisUtterance(lastMsg);
        window.speechSynthesis.speak(u);
        return;
      }
      
      // Play the array of cloud TTS chunks seamlessly
      const chunks = Array.isArray(audioData) ? audioData : [audioData];
      for (let b64 of chunks) {
        if (!b64) continue;
        await new Promise(resolve => {
          const audio = new Audio('data:audio/mpeg;base64,' + b64);
          currentAudio = audio;
          audio.onended = () => { currentAudio = null; resolve(); };
          audio.onerror = resolve;
          audio.play().catch(resolve);
        });
      }
    }

    async function transcribe(audioBlob) {
      const formData = new FormData();
      formData.append('audio', audioBlob, 'audio.webm');
      const res = await fetch('/transcribe', { method: 'POST', body: formData });
      const data = await res.json();
      return data.text;
    }

    async function askGhost(text) {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: 'default' })
      });
      return await res.json();
    }

    async function toggleRecording() {
      if (isBusy) return;

      if (!isRecording) {
        // Barge-in: instantly kill any current speech
        window.speechSynthesis.cancel();
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          
          mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = processAudio;
          
          mediaRecorder.start();
          isRecording = true;
          orb.className = 'recording';
          orb.innerText = 'STOP';
          statusEl.innerText = 'LISTENING...';
        } catch (err) {
          alert('Microphone access denied or unavailable.');
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        isBusy = true;
        orb.className = 'busy';
        orb.innerText = 'WAIT';
        statusEl.innerText = 'PROCESSING...';
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
      }
    }

    async function processAudio() {
      try {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        
        statusEl.innerText = 'TRANSCRIBING...';
        const text = await transcribe(audioBlob);
        if (!text || text.trim() === '') throw new Error('No audio detected.');
        
        addMessage(text, true);
        
        statusEl.innerText = 'THINKING...';
        const data = await askGhost(text);
        
        addMessage(data.reply, false, data.image_b64);
        
        statusEl.innerText = 'SPEAKING...';
        await playAudio(data.audio_b64);
        
      } catch (e) {
        addMessage('System Error: ' + e.message, false);
      } finally {
        isBusy = false;
        orb.className = '';
        orb.innerText = 'TAP';
        statusEl.innerText = 'STANDBY';
      }
    }
  </script>
</body>
</html>
