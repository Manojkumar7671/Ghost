<!DOCTYPE html>
<html>
<head><title>Ghost</title><style>body { background: #000; color: #0f0; font-family: monospace; }</style></head>
<body>
    <div id="log">System Online</div>
    <input type="text" id="input"><button onclick="send()">Send</button>
    <script>
        function send() {
            const input = document.getElementById('input');
            const log = document.getElementById('log');
            log.innerHTML += '<div>User: ' + input.value + '</div>';
            input.value = '';
        }
    </script>
</body>
</html>
