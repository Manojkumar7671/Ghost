<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOST</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    cursor: none;
  }

  canvas {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
  }

  /* Ghost response - floats up and dissolves */
  #msg {
    position: fixed;
    bottom: 12vh;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.75);
    font-size: 13px;
    letter-spacing: 0.2em;
    text-align: center;
    max-width: 55vw;
    line-height: 1.8;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }

  /* Tiny state indicator - just a dot, no text */
  #dot {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00e5ff;
    box-shadow: 0 0 12px #00e5ff, 0 0 30px rgba(0,229,255,0.4);
    animation: pulse 2s ease-in-out infinite;
    z-index: 10;
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    50% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.6; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="dot"></div>
<div id="msg"></div>

<script>
// ─── Canvas setup ───────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const dot    = document.getElementById('dot');
const msg    = document.getElementById('msg');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── State ──────────────────────────────────────────────────────────────────
let MODE = 'idle'; // idle | listening | thinking | speaking
let analyser, freqData, micStream;
let t = 0;

// ─── Audio analyser from mic ─────────────────────────────────────────────────
async function initMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    const ac  = new AudioContext();
    const src = ac.createMediaStreamSource(micStream);
    analyser  = ac.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.8;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
  } catch(e) {
    console.warn('Mic denied', e);
  }
}

// ─── Drawing ─────────────────────────────────────────────────────────────────
const SEGMENTS = 180;
const BASE_R   = 110;

function getFreq(i) {
  if (!freqData || !analyser) return 0;
  analyser.getByteFrequencyData(freqData);
  const idx = Math.floor((i / SEGMENTS) * (freqData.length * 0.6));
  return freqData[idx] / 255;
}

function draw() {
  requestAnimationFrame(draw);
  t += 0.012;

  // trail effect
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width  / 2;
  const cy = canvas.height / 2;

  // ── outer particle ring ──
  for (let i = 0; i < SEGMENTS; i++) {
    const angle = (i / SEGMENTS) * Math.PI * 2 - Math.PI / 2;
    const freq  = getFreq(i);

    let amp;
    if (MODE === 'listening') {
      amp = freq * 80 + Math.sin(t * 1.5 + i * 0.15) * 6 + 4;
    } else if (MODE === 'thinking') {
      amp = Math.sin(t * 4 + i * 0.25) * 22 + 8;
    } else if (MODE === 'speaking') {
      amp = Math.sin(t * 3 + i * 0.2) * 18 + freq * 40 + 6;
    } else {
      // idle — slow breathing
      amp = Math.sin(t * 0.8 + i * 0.1) * 10 + 4;
    }

    const r = BASE_R + amp;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;

    // hue shifts by mode
    const hue = MODE === 'thinking' ? 200 + amp * 1.5
              : MODE === 'speaking'  ? 170 + amp
              : 185 + Math.sin(t + i * 0.05) * 15;

    const alpha = 0.35 + freq * 0.65 + Math.sin(t + i * 0.1) * 0.1;

    ctx.beginPath();
    ctx.arc(x, y, 1.4, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${hue}, 90%, 68%, ${Math.min(1, alpha)})`;
    ctx.fill();
  }

  // ── inner secondary ring (smaller, counter-rotate) ──
  for (let i = 0; i < 90; i++) {
    const angle = -(i / 90) * Math.PI * 2 - t * 0.3;
    const r     = BASE_R * 0.52 + Math.sin(t * 2 + i * 0.35) * 8;
    const x     = cx + Math.cos(angle) * r;
    const y     = cy + Math.sin(angle) * r;
    const alpha = 0.12 + Math.sin(t * 1.5 + i * 0.2) * 0.08;

    ctx.beginPath();
    ctx.arc(x, y, 0.8, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,200,255,${alpha})`;
    ctx.fill();
  }

  // ── subtle radial glow ──
  const glowR = BASE_R * (0.9 + Math.sin(t * 0.6) * 0.05);
  const grad  = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
  const glowA = MODE === 'thinking' ? 0.07 : MODE === 'speaking' ? 0.09 : 0.04;
  grad.addColorStop(0,   `rgba(0,180,255,${glowA})`);
  grad.addColorStop(0.5, `rgba(0,120,200,${glowA * 0.4})`);
  grad.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
}

draw();

// ─── Dot color by mode ────────────────────────────────────────────────────────
function setMode(m) {
  MODE = m;
  if (m === 'listening') {
    dot.style.background = '#00e5ff';
    dot.style.boxShadow  = '0 0 12px #00e5ff, 0 0 30px rgba(0,229,255,0.4)';
    dot.style.animation  = 'pulse 1.2s ease-in-out infinite';
  } else if (m === 'thinking') {
    dot.style.background = '#fff';
    dot.style.boxShadow  = '0 0 10px #fff';
    dot.style.animation  = 'pulse 0.4s ease-in-out infinite';
  } else if (m === 'speaking') {
    dot.style.background = '#a0ffcc';
    dot.style.boxShadow  = '0 0 14px #a0ffcc, 0 0 32px rgba(160,255,200,0.4)';
    dot.style.animation  = 'pulse 0.8s ease-in-out infinite';
  } else {
    dot.style.background = '#00e5ff';
    dot.style.boxShadow  = '0 0 8px rgba(0,229,255,0.4)';
    dot.style.animation  = 'pulse 2.5s ease-in-out infinite';
  }
}

// ─── Show / hide response ─────────────────────────────────────────────────────
let hideTimer;
function showMsg(text) {
  clearTimeout(hideTimer);
  msg.textContent = text;
  msg.style.opacity = '1';
}
function hideMsg(delay = 3000) {
  hideTimer = setTimeout(() => { msg.style.opacity = '0'; }, delay);
}

// ─── Chat request ─────────────────────────────────────────────────────────────
async function sendToGhost(text) {
  setMode('thinking');
  try {
    const res  = await fetch('/chat', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ message: text })
    });
    const data = await res.json();
    return data.reply || data.response || data.text || '';
  } catch(e) {
    return 'Connection lost.';
  }
}

// ─── TTS ──────────────────────────────────────────────────────────────────────
function speak(text) {
  return new Promise(resolve => {
    speechSynthesis.cancel();
    const utt   = new SpeechSynthesisUtterance(text);
    utt.rate    = 0.92;
    utt.pitch   = 0.9;
    utt.volume  = 1;
    // try to pick a deeper voice
    const voices = speechSynthesis.getVoices();
    const deep   = voices.find(v => /daniel|alex|google uk english male|en-gb/i.test(v.name));
    if (deep) utt.voice = deep;
    utt.onend = resolve;
    utt.onerror = resolve;
    speechSynthesis.speak(utt);
  });
}

// ─── Speech Recognition ───────────────────────────────────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SR) {
  // Fallback: double-click anywhere to type
  let overlay;
  document.addEventListener('dblclick', () => {
    if (overlay) return;
    overlay = document.createElement('div');
    overlay.style.cssText = `
      position:fixed;inset:0;background:rgba(0,0,0,0.85);
      display:flex;align-items:center;justify-content:center;z-index:100;
    `;
    const inp = document.createElement('input');
    inp.style.cssText = `
      background:transparent;border:none;border-bottom:1px solid rgba(0,229,255,0.5);
      color:#fff;font:14px 'Courier New',monospace;letter-spacing:0.2em;
      text-align:center;width:50vw;outline:none;padding:8px 0;caret-color:#00e5ff;
    `;
    inp.placeholder = '...';
    overlay.appendChild(inp);
    document.body.appendChild(overlay);
    inp.focus();

    inp.addEventListener('keydown', async e => {
      if (e.key !== 'Enter' || !inp.value.trim()) return;
      const q = inp.value.trim();
      inp.value = '';
      overlay.remove(); overlay = null;

      showMsg(q);
      const reply = await sendToGhost(q);
      setMode('speaking');
      showMsg(reply);
      await speak(reply);
      setMode('listening');
      hideMsg(4000);
    });

    overlay.addEventListener('click', e => {
      if (e.target === overlay) { overlay.remove(); overlay = null; }
    });
  });

} else {

  const rec = new SR();
  rec.continuous      = true;
  rec.interimResults  = false;
  rec.lang            = 'en-US';
  let busy = false;

  rec.onresult = async (e) => {
    if (busy) return;
    const result = e.results[e.results.length - 1];
    if (!result.isFinal) return;
    const text = result[0].transcript.trim();
    if (!text) return;

    busy = true;
    showMsg(text);

    const reply = await sendToGhost(text);
    setMode('speaking');
    showMsg(reply);
    await speak(reply);

    setMode('listening');
    hideMsg(4000);
    busy = false;
  };

  rec.onerror = (e) => {
    if (e.error === 'not-allowed') return;
    setTimeout(() => { try { rec.start(); } catch(_){} }, 800);
  };

  rec.onend = () => {
    if (MODE !== 'thinking' && MODE !== 'speaking') {
      try { rec.start(); } catch(_){}
    }
  };

  // Auto-start after mic init
  initMic().then(() => {
    try { rec.start(); setMode('listening'); } catch(_){}
  });
}
</script>
</body>
</html>
