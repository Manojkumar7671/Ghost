<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOST</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    width: 100vw; height: 100vh;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', monospace;
    cursor: none;
  }
  canvas { position: fixed; top: 0; left: 0; pointer-events: none; }

  /* state dot */
  #dot {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 7px; height: 7px; border-radius: 50%;
    background: #00e5ff;
    box-shadow: 0 0 14px #00e5ff, 0 0 32px rgba(0,229,255,0.4);
    z-index: 10;
    animation: breathe 2.5s ease-in-out infinite;
    transition: background 0.3s, box-shadow 0.3s;
  }
  @keyframes breathe {
    0%,100%{ transform:translate(-50%,-50%) scale(1);   opacity:1; }
    50%    { transform:translate(-50%,-50%) scale(1.6); opacity:0.5; }
  }

  /* response text */
  #msg {
    position: fixed; bottom: 10vh; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.72);
    font-size: 13px; letter-spacing: 0.18em;
    text-align: center; max-width: 58vw; line-height: 1.9;
    opacity: 0; transition: opacity 0.8s ease;
    pointer-events: none; z-index: 10;
  }

  /* one-time tap screen */
  #tap {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #tap-hint {
    font-size: 11px; letter-spacing: 0.35em;
    color: rgba(0,229,255,0.3);
    animation: fadepulse 2s ease-in-out infinite;
  }
  @keyframes fadepulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }

  /* type overlay */
  #typeWrap {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.9); z-index: 100;
    align-items: center; justify-content: center;
  }
  #typeWrap.show { display: flex; }
  #typeInput {
    background: transparent; border: none;
    border-bottom: 1px solid rgba(0,229,255,0.4);
    color: #fff; font: 13px 'Courier New', monospace;
    letter-spacing: 0.2em; text-align: center;
    width: 52vw; outline: none; padding: 10px 0;
    caret-color: #00e5ff;
  }
  #typeInput::placeholder { color: rgba(255,255,255,0.15); }

  /* recording ring */
  #recRing {
    display: none;
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 180px; height: 180px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,80,80,0.5);
    box-shadow: 0 0 20px rgba(255,60,60,0.2);
    animation: recPulse 0.8s ease-in-out infinite;
    z-index: 5;
    pointer-events: none;
  }
  @keyframes recPulse {
    0%,100%{ transform:translate(-50%,-50%) scale(1);   opacity:0.6; }
    50%    { transform:translate(-50%,-50%) scale(1.06); opacity:1; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="dot"></div>
<div id="recRing"></div>
<div id="msg"></div>
<div id="tap"><span id="tap-hint">TAP TO ACTIVATE</span></div>
<div id="typeWrap"><input id="typeInput" placeholder="..." autocomplete="off" spellcheck="false"></div>

<script>
// ── Canvas ────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const dotEl  = document.getElementById('dot');
const msgEl  = document.getElementById('msg');
const tapEl  = document.getElementById('tap');
const recRing = document.getElementById('recRing');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);

// ── State ─────────────────────────────────────────────────────────
let MODE = 'idle', t = 0, busy = false, hideT;

// ── Particles ─────────────────────────────────────────────────────
const SEGS = 180, BASE = 108;

function fakeAmp(i, now) {
  if (MODE === 'recording') return Math.sin(now*2+i*0.18)*20 + Math.sin(now*5+i*0.4)*8 + 8;
  if (MODE === 'thinking')  return Math.sin(now*5+i*0.28)*28 + Math.sin(now*9+i*0.6)*10;
  if (MODE === 'speaking')  return Math.sin(now*3.5+i*0.22)*22 + Math.sin(now*6+i*0.5)*8 + 4;
  return Math.sin(now*0.7+i*0.1)*8 + 3; // idle
}

function draw() {
  requestAnimationFrame(draw);
  t += 0.013;
  ctx.fillStyle = 'rgba(0,0,0,0.17)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width/2, cy = canvas.height/2;

  for (let i = 0; i < SEGS; i++) {
    const angle = (i/SEGS)*Math.PI*2 - Math.PI/2;
    const amp   = fakeAmp(i, t);
    const r     = BASE + amp;
    const x     = cx + Math.cos(angle)*r;
    const y     = cy + Math.sin(angle)*r;
    const hue   = MODE === 'recording' ? 0 + amp*0.5
                : 185 + amp*0.9 + Math.sin(t+i*0.05)*12;
    const alpha = 0.3 + Math.abs(Math.sin(t*1.1+i*0.12))*0.55;
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${hue},88%,68%,${alpha})`;
    ctx.fill();
  }
  // inner ring
  for (let i = 0; i < 90; i++) {
    const angle = -(i/90)*Math.PI*2 - t*0.28;
    const r     = BASE*0.5 + Math.sin(t*1.8+i*0.32)*7;
    const x     = cx + Math.cos(angle)*r;
    const y     = cy + Math.sin(angle)*r;
    ctx.beginPath();
    ctx.arc(x, y, 0.8, 0, Math.PI*2);
    ctx.fillStyle = `rgba(0,200,255,${0.07+Math.abs(Math.sin(t*1.2+i*0.22))*0.1})`;
    ctx.fill();
  }
  // glow
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,BASE*0.9);
  const ga   = MODE==='thinking'?0.08:MODE==='speaking'?0.1:MODE==='recording'?0.07:0.04;
  grad.addColorStop(0, `rgba(0,170,255,${ga})`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.arc(cx,cy,BASE*0.9,0,Math.PI*2);
  ctx.fillStyle = grad; ctx.fill();
}
draw();

// ── Mode ──────────────────────────────────────────────────────────
function setMode(m) {
  MODE = m;
  const map = {
    idle:      ['#00e5ff','0 0 10px #00e5ff, 0 0 28px rgba(0,229,255,0.3)','2.5s'],
    listening: ['#00e5ff','0 0 14px #00e5ff, 0 0 36px rgba(0,229,255,0.45)','1.1s'],
    recording: ['#ff4444','0 0 14px #ff4444, 0 0 36px rgba(255,60,60,0.45)','0.6s'],
    thinking:  ['#ffffff','0 0 10px #fff, 0 0 24px rgba(255,255,255,0.3)','0.35s'],
    speaking:  ['#88ffcc','0 0 14px #88ffcc, 0 0 34px rgba(136,255,200,0.4)','0.75s'],
  };
  const [bg, shadow, dur] = map[m] || map.idle;
  dotEl.style.background        = bg;
  dotEl.style.boxShadow         = shadow;
  dotEl.style.animationDuration = dur;
  recRing.style.display = m === 'recording' ? 'block' : 'none';
}

// ── Message ───────────────────────────────────────────────────────
function showMsg(text) {
  clearTimeout(hideT);
  msgEl.textContent  = text;
  msgEl.style.opacity = '1';
}
function hideMsg(delay=4500) {
  hideT = setTimeout(() => { msgEl.style.opacity = '0'; }, delay);
}

// ── Ghost API ─────────────────────────────────────────────────────
async function askGhost(text) {
  setMode('thinking');
  try {
    const res  = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    return data.reply || data.response || data.message || data.text || JSON.stringify(data);
  } catch(e) { return 'Connection lost, sir.'; }
}

// ── Whisper Transcribe ─────────────────────────────────────────────
async function transcribe(blob) {
  try {
    const form = new FormData();
    form.append('audio', blob, 'audio.webm');
    const res  = await fetch('/transcribe', { method: 'POST', body: form });
    const data = await res.json();
    return data.text || '';
  } catch(e) { return ''; }
}

// ── TTS ───────────────────────────────────────────────────────────
function speakText(text) {
  return new Promise(resolve => {
    speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate = 0.92; utt.pitch = 0.88;
    const trySpeak = () => {
      const voices = speechSynthesis.getVoices();
      const pick   = voices.find(v => /daniel|alex|fred|en.gb/i.test(v.name))
                  || voices.find(v => v.lang && v.lang.startsWith('en'));
      if (pick) utt.voice = pick;
      utt.onend = resolve; utt.onerror = resolve;
      speechSynthesis.speak(utt);
    };
    speechSynthesis.getVoices().length ? trySpeak()
      : (speechSynthesis.onvoiceschanged = trySpeak);
  });
}

// ── VAD Recorder (works in Opera/Chrome/Safari/Firefox) ──────────
let mediaRecorder = null, audioChunks = [], silenceTimer = null;
let audioCtx = null, analyserNode = null, vadInterval = null;

async function initVAD() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioCtx     = new AudioContext();
  analyserNode = audioCtx.createAnalyser();
  analyserNode.fftSize = 512;
  audioCtx.createMediaStreamSource(stream).connect(analyserNode);

  const freq = new Uint8Array(analyserNode.frequencyBinCount);

  function getVolume() {
    analyserNode.getByteFrequencyData(freq);
    return freq.reduce((s,v)=>s+v,0) / freq.length;
  }

  let isSpeaking = false;
  const THRESHOLD = 14;
  const SILENCE_MS = 1400; // stop after 1.4s silence

  function startRec() {
    audioChunks = [];
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                   ? 'audio/webm;codecs=opus' : 'audio/webm';
    mediaRecorder = new MediaRecorder(stream, { mimeType });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      if (busy) return;
      busy = true;
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      setMode('thinking');
      const transcript = await transcribe(blob);
      if (!transcript.trim()) { setMode('listening'); busy = false; return; }
      showMsg(transcript);
      const reply = await askGhost(transcript);
      setMode('speaking');
      showMsg(reply);
      await speakText(reply);
      setMode('listening');
      hideMsg(4500);
      busy = false;
    };
    mediaRecorder.start();
    setMode('recording');
  }

  function stopRec() {
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    isSpeaking = false;
    setMode('thinking');
  }

  vadInterval = setInterval(() => {
    if (busy) return;
    const vol = getVolume();
    if (vol > THRESHOLD && !isSpeaking) {
      isSpeaking = true;
      clearTimeout(silenceTimer);
      startRec();
    } else if (vol <= THRESHOLD && isSpeaking) {
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(stopRec, SILENCE_MS);
    }
  }, 80);

  setMode('listening');
}

// ── Type overlay (double-click fallback) ──────────────────────────
const typeWrap  = document.getElementById('typeWrap');
const typeInput = document.getElementById('typeInput');

document.addEventListener('dblclick', () => {
  typeWrap.classList.add('show');
  typeInput.value = ''; typeInput.focus();
});
typeWrap.addEventListener('click', e => {
  if (e.target === typeWrap) typeWrap.classList.remove('show');
});
typeInput.addEventListener('keydown', async e => {
  if (e.key !== 'Enter' || !typeInput.value.trim()) return;
  const q = typeInput.value.trim();
  typeInput.value = '';
  typeWrap.classList.remove('show');
  showMsg(q);
  const reply = await askGhost(q);
  setMode('speaking');
  showMsg(reply);
  await speakText(reply);
  setMode('listening');
  hideMsg(4500);
});

// ── Boot (one tap required by browser) ───────────────────────────
tapEl.addEventListener('click', async () => {
  tapEl.remove();
  try {
    await initVAD();
  } catch(e) {
    // mic denied — type-only mode
    setMode('listening');
    showMsg('Mic blocked. Double-click to type.');
    hideMsg(4000);
  }
}, { once: true });
</script>
</body>
</html>
