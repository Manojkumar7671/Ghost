<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GHOST</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
  :root{--cyan:#00d4ff;--bg:#020c14;--border:rgba(0,212,255,0.15);--text:#c8f0ff;--text-dim:rgba(200,240,255,0.35);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,255,0.01) 2px,rgba(0,212,255,0.01) 4px);pointer-events:none;z-index:1000;}

  .corner{position:fixed;width:40px;height:40px;z-index:100;pointer-events:none;}
  .corner::before,.corner::after{content:'';position:absolute;background:rgba(0,212,255,0.5);}
  .corner::before{width:1px;height:28px;} .corner::after{width:28px;height:1px;}
  .corner.tl{top:12px;left:12px} .corner.tl::before{top:0;left:0} .corner.tl::after{top:0;left:0}
  .corner.tr{top:12px;right:12px} .corner.tr::before{top:0;right:0} .corner.tr::after{top:0;right:0}
  .corner.bl{bottom:12px;left:12px} .corner.bl::before{bottom:0;left:0} .corner.bl::after{bottom:0;left:0}
  .corner.br{bottom:12px;right:12px} .corner.br::before{bottom:0;right:0} .corner.br::after{bottom:0;right:0}

  /* TITLE */
  #title{padding-top:20px;text-align:center;flex-shrink:0;}
  #title h1{font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;letter-spacing:0.5em;color:var(--cyan);text-shadow:0 0 30px var(--cyan),0 0 60px rgba(0,212,255,0.3);}
  #orb-status{font-size:0.52rem;letter-spacing:0.4em;color:var(--text-dim);margin-top:4px;transition:color 0.3s;}
  #orb-status.listening{color:#ff3c3c;animation:blink 0.8s step-end infinite;}
  #orb-status.speaking{color:var(--cyan);}
  @keyframes blink{50%{opacity:0}}

  /* ORB */
  #orb-container{flex-shrink:0;width:min(320px,60vw);height:min(320px,60vw);position:relative;cursor:grab;}
  #orb-container:active{cursor:grabbing;}
  #orb-canvas{width:100%!important;height:100%!important;}
  .orb-ripple{position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;border:1px solid var(--cyan);transform:translate(-50%,-50%);animation:ripple 0.9s ease-out forwards;pointer-events:none;}
  @keyframes ripple{to{width:220%;height:220%;opacity:0;}}

  /* CHAT */
  #chat-log{flex:1;width:min(680px,94vw);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px 4px 4px;scrollbar-width:thin;scrollbar-color:rgba(0,212,255,0.2) transparent;}
  #chat-log::-webkit-scrollbar{width:3px;} #chat-log::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.2);}

  .msg{display:flex;flex-direction:column;gap:2px;animation:fadein 0.25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .msg-label{font-size:0.48rem;letter-spacing:0.22em;color:var(--text-dim);}
  .msg.user .msg-label{text-align:right;color:rgba(255,140,0,0.4);}
  .msg-bubble{padding:8px 14px;border-radius:2px;font-size:0.82rem;line-height:1.65;max-width:90%;border:1px solid transparent;position:relative;}
  .msg.ghost .msg-bubble{background:rgba(0,30,50,0.6);border-color:rgba(0,212,255,0.15);border-left:2px solid var(--cyan);backdrop-filter:blur(6px);}
  .msg.ghost .msg-bubble::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--cyan),transparent);opacity:0.3;}
  .msg.user{align-items:flex-end;}
  .msg.user .msg-bubble{background:rgba(255,140,0,0.05);border-color:rgba(255,140,0,0.15);border-right:2px solid #ff8c00;color:rgba(255,220,150,0.85);text-align:right;}
  .typing-indicator{display:flex;gap:4px;align-items:center;}
  .typing-dot{width:5px;height:5px;border-radius:50%;background:var(--cyan);animation:td 1.2s ease-in-out infinite;}
  .typing-dot:nth-child(2){animation-delay:0.2s} .typing-dot:nth-child(3){animation-delay:0.4s}
  @keyframes td{0%,80%,100%{transform:scale(0.5);opacity:0.3}40%{transform:scale(1);opacity:1}}

  /* BOTTOM HINT */
  #bottom-hint{flex-shrink:0;padding:10px 0 18px;font-size:0.5rem;letter-spacing:0.25em;color:rgba(0,212,255,0.2);text-align:center;}

  /* FLOATING TYPE OVERLAY - appears on double-click */
  #type-overlay{
    display:none;
    position:fixed;inset:0;z-index:500;
    background:rgba(2,12,20,0.85);
    backdrop-filter:blur(8px);
    align-items:center;justify-content:center;
    flex-direction:column;gap:12px;
  }
  #type-overlay.show{display:flex;}
  #type-input{
    width:min(500px,90vw);
    background:rgba(0,20,35,0.9);
    border:1px solid rgba(0,212,255,0.4);
    border-radius:2px;
    padding:14px 18px;
    color:var(--text);
    font-family:'Share Tech Mono',monospace;
    font-size:1rem;
    outline:none;
    caret-color:var(--cyan);
    text-align:center;
    letter-spacing:0.05em;
  }
  #type-input::placeholder{color:rgba(0,212,255,0.2);}
  #type-hint{font-size:0.5rem;letter-spacing:0.25em;color:rgba(0,212,255,0.3);}
  #type-close{font-size:0.5rem;letter-spacing:0.2em;color:rgba(0,212,255,0.25);cursor:pointer;margin-top:4px;}
  #type-close:hover{color:var(--cyan);}

  /* BOOT */
  #boot{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity 0.8s ease;}
  #boot.hidden{opacity:0;pointer-events:none;}
  .boot-logo{font-family:'Orbitron',monospace;font-size:3rem;font-weight:900;letter-spacing:0.5em;color:var(--cyan);text-shadow:0 0 40px var(--cyan);animation:flk 0.1s step-end 3;}
  @keyframes flk{50%{opacity:0}}
  .boot-bar-wrap{width:240px;height:1px;background:rgba(0,212,255,0.1);}
  .boot-bar{height:100%;background:var(--cyan);width:0%;animation:bf 2.5s ease forwards;box-shadow:0 0 8px var(--cyan);}
  @keyframes bf{to{width:100%}}
  .boot-log{font-size:0.6rem;color:rgba(0,212,255,0.35);letter-spacing:0.15em;}

  @media(max-width:600px){
    #title h1{font-size:1.4rem;letter-spacing:0.3em;}
    #orb-container{width:min(250px,72vw);height:min(250px,72vw);}
  }
</style>
</head>
<body>

<div id="boot">
  <div class="boot-logo">GHOST</div>
  <div class="boot-bar-wrap"><div class="boot-bar"></div></div>
  <div class="boot-log" id="boot-log">INITIALIZING...</div>
</div>

<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<!-- TYPE OVERLAY (double-click orb or fallback) -->
<div id="type-overlay">
  <input type="text" id="type-input" placeholder="TYPE YOUR MESSAGE..." autocomplete="off"/>
  <div id="type-hint">ENTER TO SEND · ESC TO CLOSE</div>
  <div id="type-close" onclick="closeTypeOverlay()">[ CLOSE ]</div>
</div>

<div id="title">
  <h1>GHOST</h1>
  <div id="orb-status">CLICK TO SPEAK</div>
</div>

<div id="orb-container">
  <canvas id="orb-canvas"></canvas>
</div>

<div id="chat-log"></div>

<div id="bottom-hint">CLICK ORB TO SPEAK &nbsp;·&nbsp; DOUBLE-CLICK TO TYPE &nbsp;·&nbsp; DRAG TO ROTATE</div>

<script>
const GHOST_URL = 'https://ghost-hu5t.onrender.com/chat';
let ttsEnabled=false, voiceActive=false, recognition=null, speaking=false;
let isHovered=false, isDragging=false;

// ── STATUS ──
function setStatus(text, cls=''){
  const el=document.getElementById('orb-status');
  el.textContent=text;
  el.className=cls;
}

// ── THREE.JS ORB ──
(function(){
  const container=document.getElementById('orb-container');
  const canvas=document.getElementById('orb-canvas');
  const W=container.clientWidth||300, H=container.clientHeight||300;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setSize(W,H); renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setClearColor(0x000000,0);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(55,1,0.1,100);
  camera.position.z=3.2;

  const coreGeo=new THREE.IcosahedronGeometry(0.85,5);
  const coreMat=new THREE.MeshPhongMaterial({color:0x001e35,emissive:0x003d66,specular:0x00d4ff,shininess:100,transparent:true,opacity:0.9});
  const core=new THREE.Mesh(coreGeo,coreMat); scene.add(core);

  const wireGeo=new THREE.IcosahedronGeometry(0.88,2);
  const wireMat=new THREE.MeshBasicMaterial({color:0x00d4ff,wireframe:true,transparent:true,opacity:0.2});
  const wire=new THREE.Mesh(wireGeo,wireMat); scene.add(wire);

  scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.62,32,32),new THREE.MeshBasicMaterial({color:0x00aaff,transparent:true,opacity:0.1})));

  function makeRing(r,tube,color,rx,ry=0){
    const m=new THREE.Mesh(new THREE.TorusGeometry(r,tube,8,100),new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.55}));
    m.rotation.x=rx; m.rotation.y=ry; return m;
  }
  const ring1=makeRing(1.1,0.007,0x00d4ff,Math.PI/2);
  const ring2=makeRing(1.2,0.004,0x00aaff,Math.PI/3);
  const ring3=makeRing(1.05,0.005,0x00eeff,Math.PI/6);
  scene.add(ring1,ring2,ring3);

  const pCount=180, pos=new Float32Array(pCount*3);
  for(let i=0;i<pCount;i++){
    const theta=Math.random()*Math.PI*2,phi=Math.acos(2*Math.random()-1),r=1.3+Math.random()*0.8;
    pos[i*3]=r*Math.sin(phi)*Math.cos(theta); pos[i*3+1]=r*Math.sin(phi)*Math.sin(theta); pos[i*3+2]=r*Math.cos(phi);
  }
  const pGeo=new THREE.BufferGeometry(); pGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pMat=new THREE.PointsMaterial({color:0x00d4ff,size:0.022,transparent:true,opacity:0.65});
  const pts=new THREE.Points(pGeo,pMat); scene.add(pts);

  scene.add(new THREE.AmbientLight(0x001133,3));
  const pl=new THREE.PointLight(0x00d4ff,4,12); pl.position.set(0,0,3); scene.add(pl);
  const pl2=new THREE.PointLight(0x0066ff,2,8); pl2.position.set(-2,1,1); scene.add(pl2);

  let dragStart={x:0,y:0}, orbRot={x:0,y:0}, dragRot={x:0,y:0}, dragging=false;
  let autoRotY=0, hov=0, t=0;

  function pDown(e){ dragging=true; isDragging=false; const p=e.touches?e.touches[0]:e; dragStart={x:p.clientX,y:p.clientY}; dragRot={x:orbRot.x,y:orbRot.y}; }
  function pMove(e){ if(!dragging)return; const p=e.touches?e.touches[0]:e; const dx=p.clientX-dragStart.x,dy=p.clientY-dragStart.y; if(Math.abs(dx)>3||Math.abs(dy)>3)isDragging=true; orbRot.y=dragRot.y+dx*0.012; orbRot.x=dragRot.x+dy*0.012; }
  function pUp(){ if(!isDragging)handleOrbClick(); dragging=false; }

  container.addEventListener('mouseenter',()=>isHovered=true);
  container.addEventListener('mouseleave',()=>isHovered=false);
  container.addEventListener('mousedown',pDown);
  container.addEventListener('touchstart',pDown,{passive:true});
  window.addEventListener('mousemove',pMove);
  window.addEventListener('touchmove',pMove,{passive:true});
  window.addEventListener('mouseup',pUp);
  window.addEventListener('touchend',pUp);

  // double-click to type
  let lastClick=0;
  container.addEventListener('click',()=>{
    const now=Date.now();
    if(now-lastClick<400){ openTypeOverlay(); }
    lastClick=now;
  });

  function animate(){
    requestAnimationFrame(animate); t+=0.013;
    hov+=(isHovered?1:0-hov)*0.08; hov=Math.max(0,Math.min(1,hov));
    const spk=speaking, lis=voiceActive;
    const pulse=spk?1+Math.sin(t*14)*0.14:lis?1+Math.sin(t*8)*0.06:1+Math.sin(t*1.3)*0.03+hov*0.06;
    if(!dragging){ autoRotY+=0.004; }
    wire.rotation.y=orbRot.y+autoRotY; wire.rotation.x=orbRot.x+t*0.1;
    core.rotation.y=orbRot.y+autoRotY*0.5; core.rotation.x=orbRot.x*0.5;
    pts.rotation.y=orbRot.y*0.3+t*0.06; pts.rotation.x=orbRot.x*0.2+t*0.03;
    core.scale.setScalar(pulse); wire.scale.setScalar(pulse*1.015);
    ring1.rotation.z=t*0.25+orbRot.y*0.2;
    ring2.rotation.z=-t*0.18; ring2.rotation.y=orbRot.y*0.15+t*0.1;
    ring3.rotation.z=t*0.32+orbRot.x*0.2;
    wireMat.opacity=spk?0.45+Math.sin(t*12)*0.2:lis?0.4+Math.sin(t*8)*0.15:0.18+Math.sin(t)*0.05+hov*0.25;
    pl.intensity=spk?7+Math.sin(t*14)*3:lis?6+Math.sin(t*8)*2:4+Math.sin(t*1.5)*0.8+hov*3;
    coreMat.emissive.setHex(spk?0x005588:lis?0x004400:isHovered?0x005577:0x003d66);
    pMat.opacity=0.65+hov*0.25+(spk||lis?0.2:0);
    renderer.render(scene,camera);
  }
  animate();
  window.addEventListener('resize',()=>{ const W2=container.clientWidth,H2=container.clientHeight; if(W2>0&&H2>0)renderer.setSize(W2,H2); });
})();

// ── ORB CLICK → VOICE ──
function handleOrbClick(){
  const rip=document.createElement('div'); rip.className='orb-ripple';
  document.getElementById('orb-container').appendChild(rip);
  setTimeout(()=>rip.remove(),900);
  toggleVoice();
}

// ── TYPE OVERLAY ──
function openTypeOverlay(){
  document.getElementById('type-overlay').classList.add('show');
  setTimeout(()=>document.getElementById('type-input').focus(),50);
}
function closeTypeOverlay(){
  document.getElementById('type-overlay').classList.remove('show');
  document.getElementById('type-input').value='';
}
document.getElementById('type-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); const t=document.getElementById('type-input').value.trim(); if(t){closeTypeOverlay();sendMessage(t);} }
  if(e.key==='Escape') closeTypeOverlay();
});

// ── CHAT ──
function addGhostMsg(text){
  const log=document.getElementById('chat-log');
  const d=document.createElement('div'); d.className='msg ghost';
  d.innerHTML=`<div class="msg-label">GHOST</div><div class="msg-bubble">${text}</div>`;
  log.appendChild(d); log.scrollTop=log.scrollHeight;
  if(ttsEnabled) speak(text);
}
function addUserMsg(text){
  const log=document.getElementById('chat-log');
  const d=document.createElement('div'); d.className='msg user';
  d.innerHTML=`<div class="msg-label">YOU</div><div class="msg-bubble">${text}</div>`;
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}
function showTyping(){
  const log=document.getElementById('chat-log');
  const d=document.createElement('div'); d.id='typing'; d.className='msg ghost';
  d.innerHTML=`<div class="msg-label">GHOST</div><div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
  log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
}

// ── SEND ──
async function sendMessage(text){
  addUserMsg(text);
  const typing=showTyping();
  try{
    const res=await fetch(GHOST_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const data=await res.json(); typing.remove();
    addGhostMsg(data.reply||data.response||data.message||JSON.stringify(data));
  } catch(e){ typing.remove(); addGhostMsg(`⚠ CONNECTION ERROR: ${e.message}`); }
}

// ── VOICE ──
function toggleVoice(){
  if(voiceActive){ voiceActive=false; if(recognition)recognition.stop(); return; }

  // Try native SpeechRecognition
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    // Mac Safari fallback → open type overlay
    addGhostMsg('Voice not supported in this browser, sir. Double-click the orb to type instead.');
    openTypeOverlay();
    return;
  }

  recognition=new SR();
  recognition.lang='en-US';
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.maxAlternatives=1;

  recognition.onstart=()=>{
    voiceActive=true;
    setStatus('LISTENING...','listening');
  };
  recognition.onresult=e=>{
    const transcript=e.results[0][0].transcript;
    voiceActive=false;
    setStatus('PROCESSING...','speaking');
    sendMessage(transcript);
  };
  recognition.onerror=e=>{
    voiceActive=false;
    if(e.error==='not-allowed'||e.error==='denied'){
      addGhostMsg('Microphone access denied, sir. Please allow mic access in your browser settings, or double-click the orb to type.');
    } else if(e.error==='no-speech'){
      setStatus('CLICK TO SPEAK','');
    } else {
      addGhostMsg(`Voice error: ${e.error}. Double-click orb to type instead.`);
    }
    setStatus('CLICK TO SPEAK','');
  };
  recognition.onend=()=>{
    voiceActive=false;
    if(!speaking) setStatus('CLICK TO SPEAK','');
  };

  try{ recognition.start(); }
  catch(err){ addGhostMsg('Could not start voice. Double-click the orb to type, sir.'); openTypeOverlay(); }
}

// ── TTS ──
function speak(text){
  if(!ttsEnabled) return;
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(text.replace(/[<>*#`]/g,'').slice(0,500));
  utt.rate=0.95; utt.pitch=0.85;
  const voices=window.speechSynthesis.getVoices();
  const pref=voices.find(v=>v.name.includes('Google UK')||v.name.includes('Daniel')||v.name.includes('Samantha'));
  if(pref) utt.voice=pref;
  utt.onstart=()=>{ speaking=true; setStatus('TRANSMITTING','speaking'); };
  utt.onend=utt.onerror=()=>{ speaking=false; setStatus('CLICK TO SPEAK',''); };
  window.speechSynthesis.speak(utt);
}
window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();

// ── BOOT ──
const bl=['INITIALIZING...','GROQ LINK...','SONA MEMORY...','SKILLS READY...','ONLINE.'];
let bi=0; const bEl=document.getElementById('boot-log');
const bInt=setInterval(()=>{ if(bi<bl.length)bEl.textContent=bl[bi++]; else clearInterval(bInt); },480);
setTimeout(()=>{
  document.getElementById('boot').classList.add('hidden');
  setTimeout(()=>document.getElementById('boot').remove(),900);
  addGhostMsg('GHOST online. Click the orb to speak, sir. Double-click to type.');
},2600);
</script>
</body>
</html>
