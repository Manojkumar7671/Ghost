<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>GHOST.SYS</title>
  <style>
    body { background: #030508; color: #00e5ff; font-family: monospace; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    #chat-stream { width: 80%; height: 60vh; overflow-y: auto; margin-bottom: 20px; padding: 20px; color: #00e5ff; }
  </style>
</head>
<body>
  <div id="chat-stream"></div>
  <button onclick="initializeGhost()">INITIALIZE GHOST</button>
  <button onclick="toggleVoiceRecord()">RECORD</button>
  <script>
    let mediaRecorder, audioChunks = [], isRecording = false, activeAudioElements = [], currentPlaybackId = 0;

    function stopSpeaking() {
       currentPlaybackId++; 
       window.isSpeaking = false;
       activeAudioElements.forEach(a => { a.pause(); a.src = ""; a.load(); });
       activeAudioElements = [];
    }

    async function playAudio(chunks) {
      if (!chunks) return;
      let playbackId = ++currentPlaybackId;
      for (let chunk of chunks) {
        if (playbackId !== currentPlaybackId) break;
        await new Promise(r => {
          const a = new Audio("data:audio/mp3;base64,"+chunk);
          activeAudioElements.push(a);
          a.onended = r; a.play().catch(r);
        });
      }
    }

    async function askGhost(text) {
      stopSpeaking();
      if (text.toLowerCase().includes("news")) {
          const res = await fetch('/scrape', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:'https://worldmonitor.com'})});
          const data = await res.json();
          text = "Summarize these headlines: " + data.content;
      }
      const res = await fetch('/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:text})});
      const data = await res.json();
      const clean = data.reply.replace(/###.*?###/g, "");
      const div = document.createElement('div');
      div.innerText = "GHOST: " + clean;
      document.getElementById('chat-stream').appendChild(div);
      playAudio(data.audio_b64);
    }

    async function initializeGhost() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
         const blob = new Blob(audioChunks, {type: 'audio/webm'});
         const fd = new FormData(); fd.append('audio', blob);
         const res = await fetch('/transcribe', {method:'POST', body:fd});
         const data = await res.json();
         await askGhost(data.text);
      };
    }

    async function toggleVoiceRecord() {
      if(!isRecording) { audioChunks=[]; mediaRecorder.start(); isRecording=true; }
      else { mediaRecorder.stop(); isRecording=false; }
    }
  </script>
</body>
</html>
