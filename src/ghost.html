<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOST</title>


<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;width:100vw;height:100vh;overflow:hidden;font-family:'Courier New',monospace;cursor:none;}
canvas{position:fixed;top:0;left:0;pointer-events:none;z-index:0;}
#worldMap{position:fixed;inset:0;z-index:1;width:100vw;height:100vh;opacity:0.35;pointer-events:none;}
#scanline{position:fixed;inset:0;z-index:2;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,255,0.012) 2px,rgba(0,229,255,0.012) 4px);pointer-events:none;}
.bracket{position:fixed;width:40px;height:40px;z-index:4;pointer-events:none;opacity:0.2;}
.bracket.tl{top:20px;left:20px;border-top:1px solid #00e5ff;border-left:1px solid #00e5ff;}
.bracket.tr{top:20px;right:20px;border-top:1px solid #00e5ff;border-right:1px solid #00e5ff;}
.bracket.bl{bottom:20px;left:20px;border-bottom:1px solid #00e5ff;border-left:1px solid #00e5ff;}
.bracket.br{bottom:20px;right:20px;border-bottom:1px solid #00e5ff;border-right:1px solid #00e5ff;}
#status{position:fixed;top:24px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:0.3em;color:rgba(0,229,255,0.3);z-index:10;pointer-events:none;}
#dot{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:#00e5ff;box-shadow:0 0 14px #00e5ff,0 0 32px rgba(0,229,255,0.4);z-index:10;animation:breathe 2.5s ease-in-out infinite;transition:background 0.3s,box-shadow 0.3s;}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1;}50%{transform:translate(-50%,-50%) scale(1.6);opacity:0.5;}}
#msg{position:fixed;bottom:10vh;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.72);font-size:13px;letter-spacing:0.18em;text-align:center;max-width:58vw;line-height:1.9;opacity:0;transition:opacity 0.8s ease;pointer-events:none;z-index:10;}
#tap{position:fixed;inset:0;z-index:50;cursor:pointer;background:transparent;display:flex;align-items:center;justify-content:center;}
#tap-hint{font-size:11px;letter-spacing:0.35em;color:rgba(0,229,255,0.3);animation:fadepulse 2s ease-in-out infinite;}
@keyframes fadepulse{0%,100%{opacity:0.3;}50%{opacity:0.7;}}
#typeWrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:20px;}
#typeWrap.show{display:flex;}
#typeInput{background:transparent;border:none;border-bottom:1px solid rgba(0,229,255,0.4);color:#fff;font:14px 'Courier New',monospace;letter-spacing:0.2em;text-align:center;width:60vw;outline:none;padding:12px 0;caret-color:#00e5ff;}
#typeInput::placeholder{color:rgba(255,255,255,0.12);}
#typeHint{font-size:9px;letter-spacing:0.25em;color:rgba(255,255,255,0.15);}
#recRing{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;border:1.5px solid rgba(255,80,80,0.5);box-shadow:0 0 20px rgba(255,60,60,0.2);animation:recPulse 0.8s ease-in-out infinite;z-index:5;pointer-events:none;}
@keyframes recPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.6;}50%{transform:translate(-50%,-50%) scale(1.06);opacity:1;}}
#newsPanel{display:none;position:fixed;top:0;right:0;width:360px;height:100vh;background:rgba(0,0,0,0.94);border-left:1px solid rgba(0,229,255,0.1);z-index:200;flex-direction:column;}
#newsPanel.show{display:flex;animation:slideIn 0.4s ease;}
@keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
#newsPanelHeader{padding:20px;border-bottom:1px solid rgba(0,229,255,0.08);font-size:10px;letter-spacing:0.3em;color:rgba(0,229,255,0.5);display:flex;justify-content:space-between;align-items:center;}
#newsPanelClose{cursor:pointer;color:rgba(0,229,255,0.4);font-size:18px;line-height:1;pointer-events:all;}
#newsPanelItems{flex:1;overflow-y:auto;padding:8px 0;}
#newsPanelItems::-webkit-scrollbar{width:2px;}
#newsPanelItems::-webkit-scrollbar-thumb{background:rgba(0,229,255,0.15);}
.news-item{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.03);}
.news-item-num{font-size:9px;color:rgba(0,229,255,0.35);letter-spacing:0.2em;margin-bottom:6px;}
.news-item-title{font-size:11px;color:rgba(255,255,255,0.78);line-height:1.7;letter-spacing:0.04em;}
.news-item-source{font-size:9px;color:rgba(0,229,255,0.3);letter-spacing:0.15em;margin-top:6px;}
#newsPanelFooter{padding:12px 20px;border-top:1px solid rgba(0,229,255,0.08);font-size:9px;color:rgba(255,255,255,0.1);letter-spacing:0.12em;}
#wakeIndicator{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:0.25em;color:rgba(0,229,255,0.2);z-index:10;pointer-events:none;}
</style>
</head>
<body>

<div id="scanline"></div>
<div class="bracket tl"></div>
<div class="bracket tr"></div>
<div class="bracket bl"></div>
<div class="bracket br"></div>
<canvas id="c"></canvas>
<div id="status">FRIDAY — ONLINE</div>
<div id="dot"></div>
<div id="recRing"></div>
<div id="msg"></div>
<div id="wakeIndicator">SAY "GHOST" TO ACTIVATE</div>
<div id="tap"><span id="tap-hint">TAP TO ACTIVATE</span></div>
<div id="newsPanel">
  <div id="newsPanelHeader"><span>INTEL FEED</span><span id="newsPanelClose" onclick="closeNewsPanel()">✕</span></div>
  <div id="newsPanelItems"></div>
  <div id="newsPanelFooter" id="newsPanelTime"></div>
</div>
<div id="typeWrap">
  <input id="typeInput" placeholder="speak to friday..." autocomplete="off" spellcheck="false">
  <span id="typeHint">ENTER TO SEND · ESC TO CLOSE</span>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const dotEl=document.getElementById('dot');
const msgEl=document.getElementById('msg');
const tapEl=document.getElementById('tap');
const recRing=document.getElementById('recRing');
const statusEl=document.getElementById('status');
const wakeEl=document.getElementById('wakeIndicator');

function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

let MODE='idle',t=0,busy=false,hideT;
const SEGS=180,BASE=108;

function fakeAmp(i,now){
  if(MODE==='recording')return Math.sin(now*2+i*0.18)*20+Math.sin(now*5+i*0.4)*8+8;
  if(MODE==='thinking')return Math.sin(now*5+i*0.28)*28+Math.sin(now*9+i*0.6)*10;
  if(MODE==='speaking')return Math.sin(now*3.5+i*0.22)*22+Math.sin(now*6+i*0.5)*8+4;
  return Math.sin(now*0.7+i*0.1)*8+3;
}

function draw(){
  requestAnimationFrame(draw);t+=0.013;
  ctx.fillStyle='rgba(0,0,0,0.17)';ctx.fillRect(0,0,canvas.width,canvas.height);
  const cx=canvas.width/2,cy=canvas.height/2;
  for(let i=0;i<SEGS;i++){
    const angle=(i/SEGS)*Math.PI*2-Math.PI/2;
    const amp=fakeAmp(i,t);const r=BASE+amp;
    const x=cx+Math.cos(angle)*r;const y=cy+Math.sin(angle)*r;
    const hue=MODE==='recording'?0+amp*0.5:185+amp*0.9+Math.sin(t+i*0.05)*12;
    const alpha=0.3+Math.abs(Math.sin(t*1.1+i*0.12))*0.55;
    ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);
    ctx.fillStyle=`hsla(${hue},88%,68%,${alpha})`;ctx.fill();
  }
  for(let i=0;i<90;i++){
    const angle=-(i/90)*Math.PI*2-t*0.28;
    const r=BASE*0.5+Math.sin(t*1.8+i*0.32)*7;
    const x=cx+Math.cos(angle)*r;const y=cy+Math.sin(angle)*r;
    ctx.beginPath();ctx.arc(x,y,0.8,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,200,255,${0.07+Math.abs(Math.sin(t*1.2+i*0.22))*0.1})`;ctx.fill();
  }
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,BASE*0.9);
  const ga=MODE==='thinking'?0.08:MODE==='speaking'?0.1:MODE==='recording'?0.07:0.04;
  grad.addColorStop(0,`rgba(0,170,255,${ga})`);grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(cx,cy,BASE*0.9,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
}
draw();

function setMode(m){
  MODE=m;
  const map={
    idle:['#00e5ff','0 0 10px #00e5ff,0 0 28px rgba(0,229,255,0.3)','2.5s'],
    listening:['#00e5ff','0 0 14px #00e5ff,0 0 36px rgba(0,229,255,0.45)','1.1s'],
    recording:['#ff4444','0 0 14px #ff4444,0 0 36px rgba(255,60,60,0.45)','0.6s'],
    thinking:['#ffffff','0 0 10px #fff,0 0 24px rgba(255,255,255,0.3)','0.35s'],
    speaking:['#88ffcc','0 0 14px #88ffcc,0 0 34px rgba(136,255,200,0.4)','0.75s'],
  };
  const[bg,shadow,dur]=map[m]||map.idle;
  dotEl.style.background=bg;dotEl.style.boxShadow=shadow;dotEl.style.animationDuration=dur;
  recRing.style.display=m==='recording'?'block':'none';
  statusEl.textContent='GHOST';
}

function showMsg(text){clearTimeout(hideT);msgEl.textContent=text;msgEl.style.opacity='1';}
function hideMsg(delay=5000){hideT=setTimeout(()=>{msgEl.style.opacity='0';},delay);}

let currentAudio=null;
async function playAudio(b64){
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  return new Promise(resolve=>{
    const audio=new Audio('data:audio/mpeg;base64,'+b64);
    currentAudio=audio;
    audio.onended=()=>{currentAudio=null;resolve();};
    audio.onerror=resolve;
    audio.play().catch(resolve);
  });
}

function stopAudio(){
  if(currentAudio){currentAudio.pause();currentAudio=null;}
}

async function askGhost(text){
  setMode('thinking');
  try{
    const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const data=await res.json();
    const reply=data.reply||data.response||data.message||data.text||JSON.stringify(data);
    if(/news|headline|happening|world|latest/i.test(text)&&reply.length>100)showNewsPanel(reply);
    return{reply,audio:data.audio_b64||null};
  }catch(e){return{reply:'Connection lost, sir.',audio:null};}
}

async function transcribe(blob){
  try{
    const form=new FormData();form.append('audio',blob,'audio.webm');
    const res=await fetch('/transcribe',{method:'POST',body:form});
    const data=await res.json();return data.text||'';
  }catch(e){return'';}
}

let mediaRecorder=null,audioChunks=[],silenceTimer=null;
let audioCtx=null,analyserNode=null,vadInterval=null;

async function initVAD(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  audioCtx=new AudioContext();analyserNode=audioCtx.createAnalyser();analyserNode.fftSize=512;
  audioCtx.createMediaStreamSource(stream).connect(analyserNode);
  const freq=new Uint8Array(analyserNode.frequencyBinCount);
  function getVolume(){analyserNode.getByteFrequencyData(freq);return freq.reduce((s,v)=>s+v,0)/freq.length;}
  let isSpeaking=false;
  const THRESHOLD=14,SILENCE_MS=1400;

  function startRec(){
    audioChunks=[];
    const mimeType=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';
    mediaRecorder=new MediaRecorder(stream,{mimeType});
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.onstop=async()=>{
      if(busy)return;busy=true;
      const blob=new Blob(audioChunks,{type:'audio/webm'});
      setMode('thinking');
      const transcript=await transcribe(blob);
      if(!transcript.trim()){setMode('listening');busy=false;return;}
      showMsg(transcript);
      const{reply,audio}=await askGhost(transcript);
      setMode('speaking');showMsg(reply);
      if(audio){
      await playAudio(audio);
    } else {
      await new Promise(resolve => {
        const u = new SpeechSynthesisUtterance(reply);
        
        // Target specific FRIDAY-style voices
        const voices = window.speechSynthesis.getVoices();
        const fridayVoice = voices.find(v => v.name.includes('Google UK English Female')) || 
                            voices.find(v => v.lang === 'en-GB' && v.name.includes('Female')) ||
                            voices.find(v => v.lang === 'en-GB') || 
                            voices[0];
        if(fridayVoice) u.voice = fridayVoice;
        
        u.rate = 1.05; 
        u.pitch = 1.1; 
        
        // Prevent Chrome from killing the audio mid-sentence
        const resumeInfinity = setInterval(() => {
            if (window.speechSynthesis.speaking) window.speechSynthesis.resume();
        }, 10000);
        
        u.onend = () => { clearInterval(resumeInfinity); resolve(); };
        u.onerror = (e) => { clearInterval(resumeInfinity); console.error("TTS Error:", e); resolve(); };
        
        window.speechSynthesis.speak(u);
      });
    }
      setMode('listening');hideMsg(5000);busy=false;
    };
    window.speechSynthesis.cancel();mediaRecorder.start();setMode('recording');
  }

  function stopRec(){
    if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();
    isSpeaking=false;setMode('thinking');
  }

  vadInterval=setInterval(()=>{
    const vol=getVolume();
    if(busy&&MODE==='speaking'&&vol>THRESHOLD){
      stopAudio();busy=false;isSpeaking=false;setMode('listening');
    }
    if(busy)return;
    if(vol>THRESHOLD&&!isSpeaking){isSpeaking=true;clearTimeout(silenceTimer);startRec();}
    else if(vol<=THRESHOLD&&isSpeaking){clearTimeout(silenceTimer);silenceTimer=setTimeout(stopRec,SILENCE_MS);}
  },80);
  setMode('listening');
  wakeEl.style.display='none';
}

// Wake word detection
let wakeRecognition=null;
function initWakeWord(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition)return;
  wakeRecognition=new SpeechRecognition();
  wakeRecognition.continuous=true;
  wakeRecognition.interimResults=true;
  wakeRecognition.onresult=e=>{
    const transcript=Array.from(e.results).map(r=>r[0].transcript).join('').toLowerCase();
    if(transcript.includes('ghost')&&!busy){
      wakeRecognition.stop();
      wakeEl.textContent='GHOST ACTIVATED';
      setTimeout(()=>{wakeEl.textContent='SAY "GHOST" TO ACTIVATE';},2000);
      if(tapEl.parentNode)return; if(tapEl.parentNode)return; if(tapEl.parentNode)return; initVAD().catch(()=>{});
    }
  };
  wakeRecognition.onend=()=>{if(MODE==='idle')wakeRecognition.start();};
  wakeRecognition.start();
}

const typeWrap=document.getElementById('typeWrap');
const typeInput=document.getElementById('typeInput');

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')typeWrap.classList.remove('show');
});

typeWrap.addEventListener('click',e=>{if(e.target===typeWrap)typeWrap.classList.remove('show');});
typeInput.addEventListener('keydown',async e=>{
  if(e.key!=='Enter'||!typeInput.value.trim())return;
  const q=typeInput.value.trim();typeInput.value='';typeWrap.classList.remove('show');
  showMsg(q);
  const{reply,audio}=await askGhost(q);
  setMode('speaking');showMsg(reply);
  if(audio){
      await playAudio(audio);
    } else {
      await new Promise(resolve => {
        const u = new SpeechSynthesisUtterance(reply);
        
        // Target specific FRIDAY-style voices
        const voices = window.speechSynthesis.getVoices();
        const fridayVoice = voices.find(v => v.name.includes('Google UK English Female')) || 
                            voices.find(v => v.lang === 'en-GB' && v.name.includes('Female')) ||
                            voices.find(v => v.lang === 'en-GB') || 
                            voices[0];
        if(fridayVoice) u.voice = fridayVoice;
        
        u.rate = 1.05; 
        u.pitch = 1.1; 
        
        // Prevent Chrome from killing the audio mid-sentence
        const resumeInfinity = setInterval(() => {
            if (window.speechSynthesis.speaking) window.speechSynthesis.resume();
        }, 10000);
        
        u.onend = () => { clearInterval(resumeInfinity); resolve(); };
        u.onerror = (e) => { clearInterval(resumeInfinity); console.error("TTS Error:", e); resolve(); };
        
        window.speechSynthesis.speak(u);
      });
    }
  setMode('listening');hideMsg(5000);
});

tapEl.addEventListener('click',async()=>{
  tapEl.remove();
  try{
    const tmpCtx=new AudioContext();await tmpCtx.resume();
    const buf=tmpCtx.createBuffer(1,1,22050);const src=tmpCtx.createBufferSource();
    src.buffer=buf;src.connect(tmpCtx.destination);src.start(0);
  }catch(e){}
  try{await initVAD();}catch(e){
    setMode('listening');
    showMsg('Mic blocked. Double-click to type.');hideMsg(4000);
  }
  initWakeWord();
  document.addEventListener('dblclick',()=>{
    typeWrap.classList.add('show');
    setTimeout(()=>{typeInput.value='';typeInput.focus();},50);
  });
},{once:true});

// News panel
function closeNewsPanel(){document.getElementById('newsPanel').classList.remove('show');}
function parseNewsItems(text){
  const items=[];
  const lines=text.split(/\d+\./).filter(l=>l.trim().length>10);
  lines.forEach((line,i)=>{
    const sourceMatch=line.match(/Source:\s*([^\n\.]+)/i);
    const source=sourceMatch?sourceMatch[1].trim():'';
    const title=line.replace(/Source:[^\n]*/i,'').trim().slice(0,140);
    if(title.length>10)items.push({num:i+1,title,source});
  });
  return items;
}
function showNewsPanel(text){
  const panel=document.getElementById('newsPanel');
  const container=document.getElementById('newsPanelItems');
  const footer=document.getElementById('newsPanelFooter');
  const items=parseNewsItems(text);
  container.innerHTML='';
  if(items.length===0){
    container.innerHTML='<div class="news-item"><div class="news-item-title">'+text.slice(0,400)+'</div></div>';
  }else{
    items.forEach(item=>{
      const div=document.createElement('div');div.className='news-item';
      div.innerHTML='<div class="news-item-num">0'+item.num+'</div><div class="news-item-title">'+item.title+'</div>'+(item.source?'<div class="news-item-source">'+item.source.toUpperCase()+'</div>':'');
      container.appendChild(div);
    });
  }
  footer.textContent=new Date().toUTCString().slice(0,25).toUpperCase();
  panel.classList.add('show');
}


</script>
</body>
</html>
