<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GHOST.SYS</title>
  <style>
    body { background: #030508; color: #00e5ff; font-family: monospace; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    #chat-stream { width: 70%; height: 60vh; overflow-y: auto; border: 1px solid #00e5ff; padding: 20px; margin-bottom: 20px; }
    #input-area { width: 70%; display: flex; gap: 10px; }
    input { flex-grow: 1; background: #000; border: 1px solid #00e5ff; color: #fff; padding: 10px; }
    button { background: #00e5ff; color: #000; padding: 10px 20px; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div id="chat-stream"></div>
  <div id="input-area">
    <input type="text" id="text-input" placeholder="Type here...">
    <button onclick="send()">Send</button>
  </div>
  <script>
    function send() {
      const input = document.getElementById('text-input');
      if (!input.value.trim()) return;
      const log = document.getElementById('chat-stream');
      log.innerHTML += '<div>User: ' + input.value + '</div>';
      input.value = '';
      log.scrollTop = log.scrollHeight;
    }
  </script>
</body>
</html>
