<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRIDAY — ONLINE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  
  body {
    background-color: #030303;
    color: #00e5ff;
    font-family: 'Share Tech Mono', monospace;
    margin: 0; padding: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; overflow: hidden;
    background-image: radial-gradient(circle at center, #0a192f 0%, #030303 100%);
  }

  /* Sci-Fi HUD Corners */
  .hud-corner { position: absolute; width: 40px; height: 40px; border-color: rgba(0, 229, 255, 0.2); border-style: solid; }
  .tl { top: 20px; left: 20px; border-width: 1px 0 0 1px; }
  .tr { top: 20px; right: 20px; border-width: 1px 1px 0 0; }
  .bl { bottom: 20px; left: 20px; border-width: 0 0 1px 1px; }
  .br { bottom: 20px; right: 20px; border-width: 0 1px 1px 0; }

  header {
    position: absolute; top: 30px; font-size: 10px; letter-spacing: 6px; opacity: 0.4; text-transform: uppercase;
  }

  #chat-container {
    width: 80%; max-width: 800px; height: 60vh; overflow-y: auto; margin-bottom: 10vh;
    padding-right: 15px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
  }
  
  #chat-container::-webkit-scrollbar { width: 2px; }
  #chat-container::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.2); }

  .log-entry { font-size: 13px; line-height: 1.6; letter-spacing: 0.5px; display: flex; flex-direction: column; opacity: 0; animation: fadeIn 0.5s forwards; }
  .log-entry.user { color: #00ffaa; text-align: right; align-items: flex-end; }
  .log-entry.ai { color: rgba(0, 229, 255, 0.9); text-align: left; align-items: flex-start; }
  
  .log-label { font-size: 9px; opacity: 0.4; margin-bottom: 5px; letter-spacing: 2px; text-transform: uppercase; }

  img.vision-result {
    max-width: 100%; border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 2px;
    margin-top: 15px; filter: grayscale(20%) contrast(1.2); box-shadow: 0 0 20px rgba(0, 229, 255, 0.05);
  }

  /* The Minimalist Activator */
  #center-console { position: absolute; bottom: 12vh; display: flex; flex-direction: column; align-items: center; }
  
  #activator {
    background: transparent; border: none; color: rgba(0, 229, 255, 0.5); font-family: 'Share Tech Mono', monospace;
    font-size: 12px; letter-spacing: 4px; cursor: pointer; transition: all 0.3s ease;
    display: flex; align-items: center; justify-content: center; text-transform: uppercase; padding: 15px 30px; outline: none;
  }
  
  #activator:hover { color: #00e5ff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
  
  .dot {
    display: inline-block; width: 6px; height: 6px; background: rgba(0,229,255,0.4);
    border-radius: 50%; margin: 0 15px; transition: all 0.3s ease;
  }

  /* Interactive States */
  #activator.listening { color: #00ffaa; text-shadow: 0 0 15px rgba(0, 255, 170, 0.5); }
  #activator.listening .dot { background: #00ffaa; box-shadow: 0 0 15px #00ffaa; animation: pulse-dot 0.8s infinite alternate; }
  
  #activator.processing { color: #ff0055; text-shadow: 0 0 15px rgba(255, 0, 85, 0.5); pointer-events: none; }
  #activator.processing .dot { background: #ff0055; box-shadow: 0 0 15px #ff0055; animation: spin-dot 1s infinite linear; }

  @keyframes pulse-dot { from { transform: scale(1); opacity: 0.5; } to { transform: scale(1.8); opacity: 1; } }
  @keyframes spin-dot { 0% { transform: rotate(0deg) translateX(8px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(8px) rotate(-360deg); } }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
  <div class="hud-corner tl"></div>
  <div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div>
  <div class="hud-corner br"></div>

  <header>FRIDAY — ONLINE</header>

  <div id="chat-container"></div>

  <div id="center-console">
    <button id="activator" onclick="toggleRecording()">TAP <span class="dot"></span> ACTIVATE</button>
  </div>

  <script>
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let isBusy = false;
    let currentAudio = null;

    const activator = document.getElementById('activator');
    const dot = activator.querySelector('.dot');
    const chatContainer = document.getElementById('chat-container');

    function appendLog(text, isUser = false, imageB64 = null) {
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + (isUser ? 'user' : 'ai');
      
      const label = document.createElement('div');
      label.className = 'log-label';
      label.innerText = isUser ? 'USER.INPUT' : 'FRIDAY.SYS';
      
      const content = document.createElement('div');
      content.innerText = text;
      
      entry.appendChild(label);
      entry.appendChild(content);

      if (imageB64) {
        const img = document.createElement('img');
        img.src = 'data:image/png;base64,' + imageB64;
        img.className = 'vision-result';
        entry.appendChild(img);
      }
      
      chatContainer.appendChild(entry);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function playAudio(audioData) {
      if (!audioData) {
        const lastMsg = chatContainer.lastChild.innerText.replace('FRIDAY.SYS\n', '');
        const u = new SpeechSynthesisUtterance(lastMsg);
        window.speechSynthesis.speak(u);
        return;
      }
      
      const chunks = Array.isArray(audioData) ? audioData : [audioData];
      for (let b64 of chunks) {
        if (!b64) continue;
        await new Promise(resolve => {
          const audio = new Audio('data:audio/mpeg;base64,' + b64);
          currentAudio = audio;
          audio.onended = () => { currentAudio = null; resolve(); };
          audio.onerror = resolve;
          audio.play().catch(resolve);
        });
      }
    }

    async function transcribe(audioBlob) {
      const formData = new FormData();
      formData.append('audio', audioBlob, 'audio.webm');
      const res = await fetch('/transcribe', { method: 'POST', body: formData });
      if (!res.ok) throw new Error('Transcription API failed');
      const data = await res.json();
      return data.text;
    }

    async function askGhost(text) {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: 'default' })
      });
      if (!res.ok) throw new Error('Logic API failed');
      return await res.json();
    }

    async function toggleRecording() {
      if (isBusy) return;

      if (!isRecording) {
        window.speechSynthesis.cancel();
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          
          mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = processAudio;
          
          mediaRecorder.start();
          isRecording = true;
          
          activator.className = 'listening';
          activator.innerHTML = 'STOP <span class="dot"></span> LISTENING';
        } catch (err) {
          alert('Microphone access denied.');
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        isBusy = true;
        
        activator.className = 'processing';
        activator.innerHTML = 'STANDBY <span class="dot"></span> UPLINKING';
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
      }
    }

    async function processAudio() {
      try {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        
        const text = await transcribe(audioBlob);
        if (!text || text.trim() === '') throw new Error('No audio detected.');
        
        appendLog(text, true);
        
        const data = await askGhost(text);
        
        appendLog(data.reply, false, data.image_b64);
        
        activator.className = '';
        activator.innerHTML = 'TAP <span class="dot"></span> SPEAKING';
        
        await playAudio(data.audio_b64);
        
      } catch (e) {
        appendLog('ERROR: ' + e.message, false);
      } finally {
        isBusy = false;
        activator.className = '';
        activator.innerHTML = 'TAP <span class="dot"></span> ACTIVATE';
      }
    }
  </script>
</body>
</html>
