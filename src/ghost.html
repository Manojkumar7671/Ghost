<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GHOST.SYS // INTERFACE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030712;
      color: #00e5ff;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #init-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(3, 7, 18, 0.95); z-index: 3000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      cursor: pointer;
    }
    .boot-btn {
      border: 1px solid #00e5ff; padding: 15px 40px; background: transparent;
      color: #00e5ff; font-family: monospace; font-size: 16px; letter-spacing: 3px;
      text-transform: uppercase; box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
      transition: all 0.3s ease;
    }
    .boot-btn:hover { background: #00e5ff; color: #030712; box-shadow: 0 0 25px #00e5ff; }
    
    #terminal {
      flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px;
    }
    .log-line { line-height: 1.6; font-size: 14px; animation: fadeIn 0.2s ease-out; }
    .user-log { color: #ffffff; }
    .ghost-log { color: #00e5ff; }
    
    #controls {
      padding: 20px; border-top: 1px solid rgba(0, 229, 255, 0.15);
      background: rgba(15, 23, 42, 0.4); display: flex; gap: 15px; align-items: center;
    }
    #user-input {
      flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 12px 20px; color: #ffffff; font-family: monospace; font-size: 14px;
      outline: none; transition: border 0.3s;
    }
    #user-input:focus { border-color: #00e5ff; }
    .action-btn {
      background: transparent; border: 1px solid rgba(0, 229, 255, 0.4); color: #00e5ff;
      padding: 12px 25px; font-family: monospace; cursor: pointer; transition: all 0.2s;
    }
    .action-btn:hover { background: rgba(0, 229, 255, 0.1); border-color: #00e5ff; }
    #mic-btn { border-radius: 50%; width: 45px; height: 45px; padding: 0; display: flex; align-items: center; justify-content: center; }
    #mic-btn.recording { border-color: #ff0055; color: #ff0055; animation: pulse 1.5s infinite; }
    
    #sidebar {
      position: fixed; top: 0; right: 0; width: 500px; height: 100vh;
      background: rgba(3, 7, 18, 0.98); border-left: 1px solid rgba(0, 229, 255, 0.3);
      box-shadow: -10px 0 40px rgba(0, 229, 255, 0.15);
      transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.1, 0.8, 0.2, 1);
      z-index: 2000; padding: 25px; display: flex; flex-direction: column;
      backdrop-filter: blur(15px);
    }
    #sidebar.active { transform: translateX(0); }
    #sidebar-header { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,229,255,0.2); padding-bottom: 15px; margin-bottom: 20px; font-size: 13px; font-weight: bold; letter-spacing: 2px;}
    #sidebar-close { cursor: pointer; color: #ff0055; }
    #sidebar-content { overflow-y: auto; flex-grow: 1; font-size: 13px; line-height: 1.5; color: #a0f0ff;}
    #sidebar-content pre { background: rgba(0, 229, 255, 0.05); padding: 15px; border-radius: 4px; border: 1px solid rgba(0,229,255,0.15); overflow-x: auto; white-space: pre-wrap; margin-bottom: 15px;}
    
    #status-bar { padding: 5px 25px; font-size: 11px; color: rgba(0, 229, 255, 0.5); border-top: 1px solid rgba(0, 229, 255, 0.05); background: #020617; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 0, 85, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); } }
  </style>
</head>
<body>

  <div id="init-overlay" onclick="this.style.display='none'; initializeGhost();">
    <button class="boot-btn">Initialize Ghost Connection</button>
  </div>

  <div id="terminal">
    <div class="log-line ghost-log">GHOST.SYS // SYSTEM ONLINE. AWAITING OPERATOR INPUT...</div>
  </div>

  <div id="controls">
    <input type="text" id="user-input" placeholder="Execute command or press enter..." autocomplete="off">
    <button class="action-btn" id="send-btn" onclick="handleTextSubmit()">SEND</button>
    <button class="action-btn" id="mic-btn" onclick="toggleVoiceRecord()">M</button>
  </div>

  <div id="status-bar">STATUS // <span id="sys-status">STANDBY</span></div>

  <div id="sidebar">
    <div id="sidebar-header">
      <span>[ GHOST.SYS // DATA TERMINAL ]</span>
      <span id="sidebar-close" onclick="document.getElementById('sidebar').classList.remove('active')">[ CLOSE ]</span>
    </div>
    <div id="sidebar-content"></div>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    window.isSpeaking = false;
    let isRecording = false;

    document.getElementById('user-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleTextSubmit();
    });

    function updateStatus(text) {
      document.getElementById('sys-status').innerText = text.toUpperCase();
    }

    function appendLog(text, isUser = false) {
      const term = document.getElementById('terminal');
      const line = document.createElement('div');
      line.className = isUser ? 'log-line user-log' : 'log-line ghost-log';
      line.innerText = isUser ? `USER.INPUT // ${text}` : `GHOST.SYS // ${text}`;
      term.appendChild(line);
      term.scrollTop = term.scrollHeight;
    }

    function initializeGhost() {
      appendLog("Core hardware handshake established. Systems operational.");
      navigator.mediaDevices.getUserMedia({ audio: true }).then(s => s.getTracks().forEach(t => t.stop())).catch(console.warn);
    }

    function processTaskData(replyText) {
      const sidebar = document.getElementById('sidebar');
      const content = document.getElementById('sidebar-content');
      // Safe Regex initialization to avoid browser syntax crashes
      const codeRegex = new RegExp('```[\\s\\S]*?```', 'g');
      const matches = replyText.match(codeRegex);
      
      if (matches && matches.length > 0) {
        let cleanReply = replyText;
        let sidebarHtml = '';
        
        matches.forEach(match => {
          cleanReply = cleanReply.replace(match, '\n[DATA PAYLOAD SENT TO SIDEBAR TERMINAL]\n');
          let codeContent = match.replace(/```[a-zA-Z]*/g, '').replace(/```/g, '').trim();
          sidebarHtml += `<pre><code>${codeContent}</code></pre>`;
        });
        
        content.innerHTML = sidebarHtml;
        sidebar.classList.add('active');
        // Strip any remaining tool tags from the UI log
        if (cleanReply.includes('###')) cleanReply = cleanReply.split('###')[0];
        return cleanReply.trim();
      }
      // If no sidebar data, still ensure tags are stripped from UI
      if (replyText.includes('###')) replyText = replyText.split('###')[0];
      return replyText.trim();
    }

    async function playAudio(chunks) {
      if (!chunks || chunks.length === 0) return;
      window.isSpeaking = true;
      updateStatus('speaking');
      
      for (const base64 of chunks) {
        await new Promise((resolve) => {
          const audio = new Audio("data:audio/mp3;base64," + base64);
          audio.onended = resolve;
          audio.onerror = resolve;
          audio.play().catch(resolve);
        });
      }
      window.isSpeaking = false;
      updateStatus('standby');
    }

    async function handleTextSubmit() {
      const inputEl = document.getElementById('user-input');
      const text = inputEl.value.trim();
      if (!text || window.isSpeaking) return;
      
      inputEl.value = '';
      appendLog(text, true);
      await askGhost(text);
    }

    async function toggleVoiceRecord() {
      if (window.isSpeaking) return;
      const micBtn = document.getElementById('mic-btn');
      
      if (isRecording) {
        mediaRecorder.stop();
        micBtn.classList.remove('recording');
        isRecording = false;
        updateStatus('processing');
      } else {
        audioChunks = [];
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
        
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const formData = new FormData();
          formData.append('audio', audioBlob, 'audio.webm');
          
          try {
            const res = await fetch('/transcribe', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.text && data.text.trim() !== '') {
              appendLog(data.text, true);
              await askGhost(data.text);
            } else {
              updateStatus('standby');
            }
          } catch (err) {
            console.error(err);
            updateStatus('standby');
          }
          stream.getTracks().forEach(t => t.stop());
        };
        
        mediaRecorder.start();
        micBtn.classList.add('recording');
        isRecording = true;
        updateStatus('listening');
      }
    }

    async function captureAndAnalyzeScreen() {
      try {
        updateStatus('capturing window');
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        stream.getVideoTracks()[0].stop();
        const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        updateStatus('uplinking matrix');

        const res = await fetch('/analyze-vision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Image })
        });
        const data = await res.json();
        
        appendLog(data.reply, false);
        await playAudio(data.audio_b64);
      } catch (err) {
        console.error('Vision Core Error:', err);
      } finally {
        updateStatus('standby');
      }
    }

    async function askGhost(text) {
      try {
        updateStatus('processing');
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        
        if (data.reply) {
          data.reply = processTaskData(data.reply);
          appendLog(data.reply, false);
        }
        
        if (data.trigger_capture) {
          await captureAndAnalyzeScreen();
          return;
        }
        
        if (data.open_url) window.open(data.open_url, '_blank');
        if (data.audio_b64) await playAudio(data.audio_b64);
        else updateStatus('standby');
      } catch (err) {
        console.error(err);
        updateStatus('standby');
      }
    }
  </script>
</body>
</html>
